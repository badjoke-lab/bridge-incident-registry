name: Apply Force Bridge tranche 06
on:
  workflow_dispatch:
  push:
    branches:
      - canonical/growth-batch-21-tranche-06-force-bridge
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-21-tranche-06-force-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/apply-force-bridge-tranche-06.mjs
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "Add Force Bridge 2025 canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-06-force-bridge