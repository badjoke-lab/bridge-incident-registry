name: Apply Force Bridge tranche 06
on:
  workflow_dispatch:
  push:
    branches:
      - canonical/growth-batch-21-tranche-06-force-bridge
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-21-tranche-06-force-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/apply-force-bridge-tranche-06.mjs
      - name: Normalize unsupported reference keys
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          for (const p of ['data/bridges.json','data/events.json']) {
            const rows=JSON.parse(fs.readFileSync(p,'utf8'));
            for (const r of rows) {
              if (r.id==='bir_bridge_000080' || r.bridge_id==='bir_bridge_000080') {
                for (const k of ['primary_chains','affected_chains']) if (Array.isArray(r[k])) r[k]=[...new Set(r[k].map(x=>x==='nervos-ckb'?'unknown':x))];
                for (const k of ['primary_assets','affected_assets']) if (Array.isArray(r[k])) r[k]=[...new Set(r[k].map(x=>x==='btcb'?'unknown':x))];
              }
            }
            fs.writeFileSync(p,JSON.stringify(rows,null,2)+'\n');
          }
          NODE
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "Add Force Bridge 2025 canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-06-force-bridge