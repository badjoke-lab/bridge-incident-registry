name: Temporary Sync Wanchain Document Counts

on:
  push:
    branches:
      - canonical/wanchain-cardano-2026
    paths:
      - scripts/tmp-sync-wanchain-doc-counts.mjs
      - .github/workflows/tmp-sync-wanchain-doc-counts.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v7
        with:
          ref: canonical/wanchain-cardano-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Synchronize current count blocks
        run: node scripts/tmp-sync-wanchain-doc-counts.mjs

      - name: Validate complete built output
        run: |
          npm run validate:data
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run build
          npm run dist:check

      - name: Commit synchronized documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          if git diff --cached --quiet; then
            echo 'Expected document synchronization diff was not generated.' >&2
            exit 1
          fi
          git commit -m 'docs: sync Wanchain canonical counts'
          git push origin HEAD:canonical/wanchain-cardano-2026
