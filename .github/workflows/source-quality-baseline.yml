name: Source Quality Baseline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/phase3-source-quality-baseline' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-source-quality-baseline
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate source quality baseline
        run: node scripts/report-source-quality-baseline.mjs

      - name: Commit generated inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.source-quality-baseline-inventory.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: capture source quality baseline [inventory]"
          git push origin HEAD:agent/phase3-source-quality-baseline
