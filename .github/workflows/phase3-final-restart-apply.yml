name: Apply Final Phase 3 Restart Migration

on:
  push:
    branches:
      - agent/phase3-final-restart-canonical
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-final-restart-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical migration
        run: node scripts/apply-phase3-final-restart.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate generated canonical state
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:full-corpus:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Commit canonical changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/events.json data/evidence.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Expected canonical migration produced no staged changes."
            exit 1
          fi
          git commit -m "data: close Phase 3 restart warnings [restart-applied]"
          git push origin HEAD:agent/phase3-final-restart-canonical
