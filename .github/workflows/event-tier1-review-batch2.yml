name: Event Tier 1 Review Batch 2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'agent/phase3-event-tier1-review-batch2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate event Tier 1 inventory
        run: node scripts/report-event-tier1-review-batch2.mjs

      - name: Commit generated inventory
        run: |
          if [ -z "$(git status --porcelain -- docs/audits/.event-tier1-review-batch2.md)" ]; then
            echo "No inventory change generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.event-tier1-review-batch2.md
          git commit -m "docs: capture event Tier 1 Batch 2 inventory [inventory]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
