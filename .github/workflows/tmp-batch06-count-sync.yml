name: TEMP Batch 06 Count Sync

on:
  push:
    branches:
      - canonical/growth-batch-06-three-bridges

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-06-three-bridges
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync count-bearing docs
        run: node scripts/tmp-sync-batch06-counts.mjs
      - name: Verify dist consistency from rebuilt output
        run: |
          npm install
          npm run build
          npm run dist:check
      - name: Remove temporary helper and commit sync
        run: |
          rm scripts/tmp-sync-batch06-counts.mjs .github/workflows/tmp-batch06-count-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md scripts/tmp-sync-batch06-counts.mjs .github/workflows/tmp-batch06-count-sync.yml
          git commit -m "docs: sync Batch 06 canonical counts"
          git push origin HEAD:canonical/growth-batch-06-three-bridges
