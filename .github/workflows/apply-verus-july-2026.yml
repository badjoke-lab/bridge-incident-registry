name: Apply Verus July 2026 canonical package

on:
  push:
    branches:
      - canonical/verus-ethereum-july-2026
    paths:
      - scripts/apply-verus-july-2026.mjs
      - .github/workflows/apply-verus-july-2026.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-verus-july-2026.mjs
      - .github/workflows/apply-verus-july-2026.yml

permissions:
  contents: write

concurrency:
  group: apply-verus-july-2026
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event_name == 'push' || github.head_ref == 'canonical/verus-ethereum-july-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: canonical/verus-ethereum-july-2026
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded canonical package
        run: node scripts/apply-verus-july-2026.mjs

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Check exact source counts
        run: npm run audit:source-count

      - name: Check source quality baseline
        run: npm run audit:source-quality

      - name: Run full corpus audit
        run: npm run audit:full-corpus

      - name: Build public site
        run: npm run build

      - name: Check generated distribution consistency
        run: npm run dist:check

      - name: Check patch whitespace
        run: git diff --check

      - name: Remove one-shot applicator
        run: |
          git rm scripts/apply-verus-july-2026.mjs
          git rm .github/workflows/apply-verus-july-2026.yml

      - name: Restore dependency metadata if install touched it
        run: |
          git restore package.json 2>/dev/null || true
          git restore package-lock.json 2>/dev/null || true

      - name: Commit validated canonical package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/bridges.json \
            data/incidents.json \
            data/events.json \
            data/evidence.json \
            data/reference/chains.json \
            data/reference/assets.json \
            README.md \
            docs/runbooks/current-status.md \
            docs/runbooks/development-roadmap.md \
            docs/runbooks/public-consistency-remediation.md \
            docs/runbooks/recovery-checkpoint.md
          git status --short
          git commit -m "Add reviewed Verus July 2026 bridge incident"
          git push origin HEAD:canonical/verus-ethereum-july-2026
