name: Strengthen Cross-Record Bridge Integrity

on:
  push:
    branches:
      - agent/strengthen-cross-record-bridge-integrity

permissions:
  contents: write

concurrency:
  group: strengthen-cross-record-bridge-integrity
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/strengthen-cross-record-bridge-integrity
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply validator strengthening
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const auditPath = 'scripts/audit-full-corpus.mjs';
          let audit = fs.readFileSync(auditPath, 'utf8');
          const eventNeedle = '  const incident = event.incident_id ? incidentsById.get(event.incident_id) : null;\n  if (event.event_type === "reimbursement_completed" && incident?.reimbursement_status !== "completed") {';
          if ((audit.split(eventNeedle).length - 1) !== 1) throw new Error('event bridge integrity insertion boundary moved');
          audit = audit.replace(eventNeedle, [
            '  const incident = event.incident_id ? incidentsById.get(event.incident_id) : null;',
            '  if (incident && event.bridge_id !== incident.bridge_id) {',
            '    errors.push(`${event.id}: event bridge mismatch; incident ${incident.id} belongs to ${incident.bridge_id}, event has ${event.bridge_id}`);',
            '  }',
            '  if (event.event_type === "reimbursement_completed" && incident?.reimbursement_status !== "completed") {'
          ].join('\n'));

          const sourceNeedle = [
            '  if (source.event_id) {',
            '    const event = eventsById.get(source.event_id);',
            '    if (event) {',
            '      const expectedIncidentId = event.incident_id ?? null;',
            '      const actualIncidentId = source.incident_id ?? null;'
          ].join('\n');
          if ((audit.split(sourceNeedle).length - 1) !== 1) throw new Error('evidence bridge integrity insertion boundary moved');
          audit = audit.replace(sourceNeedle, [
            '  if (source.incident_id) {',
            '    const incident = incidentsById.get(source.incident_id);',
            '    if (incident && source.bridge_id !== incident.bridge_id) {',
            '      errors.push(`${source.id}: incident evidence bridge mismatch; incident ${incident.id} belongs to ${incident.bridge_id}, evidence has ${source.bridge_id}`);',
            '    }',
            '  }',
            '  if (source.event_id) {',
            '    const event = eventsById.get(source.event_id);',
            '    if (event) {',
            '      if (source.bridge_id !== event.bridge_id) {',
            '        errors.push(`${source.id}: event evidence bridge mismatch; event ${event.id} belongs to ${event.bridge_id}, evidence has ${source.bridge_id}`);',
            '      }',
            '      const expectedIncidentId = event.incident_id ?? null;',
            '      const actualIncidentId = source.incident_id ?? null;'
          ].join('\n'));
          fs.writeFileSync(auditPath, audit);

          const testPath = 'scripts/test-full-corpus-audit.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const fixtureNeedle = 'withFixture(\n  "event-evidence-incident-mismatch",';
          if ((test.split(fixtureNeedle).length - 1) !== 1) throw new Error('controlled fixture insertion boundary moved');
          const fixtures = [
            'withFixture(',
            '  "event-incident-bridge-mismatch",',
            '  (fixtureRoot) => {',
            '    const bridges = readJson(fixtureRoot, "data/bridges.json");',
            '    const incidents = readJson(fixtureRoot, "data/incidents.json");',
            '    const events = readJson(fixtureRoot, "data/events.json");',
            '    const event = events.find((item) => item.incident_id);',
            '    if (!event) throw new Error("fixture requires an incident-linked event");',
            '    const incident = incidents.find((item) => item.id === event.incident_id);',
            '    if (!incident) throw new Error("fixture requires a valid linked incident");',
            '    const otherBridge = bridges.find((item) => item.id !== incident.bridge_id);',
            '    if (!otherBridge) throw new Error("fixture requires a second bridge");',
            '    event.bridge_id = otherBridge.id;',
            '    writeJson(fixtureRoot, "data/events.json", events);',
            '  },',
            '  "event bridge mismatch"',
            ');',
            '',
            'withFixture(',
            '  "incident-evidence-bridge-mismatch",',
            '  (fixtureRoot) => {',
            '    const bridges = readJson(fixtureRoot, "data/bridges.json");',
            '    const incidents = readJson(fixtureRoot, "data/incidents.json");',
            '    const evidence = readJson(fixtureRoot, "data/evidence.json");',
            '    const source = evidence.find((item) => item.incident_id);',
            '    if (!source) throw new Error("fixture requires incident-linked evidence");',
            '    const incident = incidents.find((item) => item.id === source.incident_id);',
            '    if (!incident) throw new Error("fixture requires a valid linked incident");',
            '    const otherBridge = bridges.find((item) => item.id !== incident.bridge_id);',
            '    if (!otherBridge) throw new Error("fixture requires a second bridge");',
            '    source.bridge_id = otherBridge.id;',
            '    writeJson(fixtureRoot, "data/evidence.json", evidence);',
            '  },',
            '  "incident evidence bridge mismatch"',
            ');',
            '',
            'withFixture(',
            '  "event-evidence-bridge-mismatch",',
            '  (fixtureRoot) => {',
            '    const bridges = readJson(fixtureRoot, "data/bridges.json");',
            '    const events = readJson(fixtureRoot, "data/events.json");',
            '    const evidence = readJson(fixtureRoot, "data/evidence.json");',
            '    const source = evidence.find((item) => item.event_id);',
            '    if (!source) throw new Error("fixture requires event-linked evidence");',
            '    const event = events.find((item) => item.id === source.event_id);',
            '    if (!event) throw new Error("fixture requires a valid linked event");',
            '    const otherBridge = bridges.find((item) => item.id !== event.bridge_id);',
            '    if (!otherBridge) throw new Error("fixture requires a second bridge");',
            '    source.bridge_id = otherBridge.id;',
            '    writeJson(fixtureRoot, "data/evidence.json", evidence);',
            '  },',
            '  "event evidence bridge mismatch"',
            ');',
            ''
          ].join('\n');
          test = test.replace(fixtureNeedle, `${fixtures}${fixtureNeedle}`);
          if (!test.includes('Full-corpus audit controlled failure tests passed (8 fixtures).')) throw new Error('fixture count summary boundary moved');
          test = test.replace('Full-corpus audit controlled failure tests passed (8 fixtures).', 'Full-corpus audit controlled failure tests passed (11 fixtures).');
          fs.writeFileSync(testPath, test);

          fs.mkdirSync('docs/audits', { recursive: true });
          const auditDoc = [
            '# Phase 3 Validator Strengthening — Cross-Record Bridge Integrity',
            '',
            'Date: 2026-08-09',
            '',
            '## New blocking invariants',
            '',
            '- an event linked to an incident must use the same `bridge_id` as that incident;',
            '- evidence linked to an incident must use the same `bridge_id` as that incident;',
            '- evidence linked to an event must use the same `bridge_id` as that event.',
            '',
            'These checks close a relational-integrity gap that became more important as event-scoped evidence copies were added. Existing canonical data must pass all three invariants with zero exceptions.',
            '',
            '## Controlled failure coverage',
            '',
            'Three new fixtures deliberately introduce each mismatch independently and require `audit:full-corpus` to fail. Existing eight controlled failure fixtures remain unchanged.',
            '',
            '## Scope',
            '',
            'Validator/test/audit documentation only. No canonical JSON, counts, source-quality ceilings, routes, runtime behavior, or production publication semantics change.',
            ''
          ].join('\n');
          fs.writeFileSync('docs/audits/phase3-validator-cross-record-bridge-integrity-2026-08-09.md', auditDoc);
          NODE

      - name: Install dependencies without lockfile side effects
        run: npm install --no-package-lock

      - name: Run complete repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Remove one-shot workflow and assert scope
        run: |
          rm .github/workflows/apply-cross-record-bridge-integrity.yml
          git fetch origin main
          actual="$({ git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            docs/audits/phase3-validator-cross-record-bridge-integrity-2026-08-09.md \
            scripts/audit-full-corpus.mjs \
            scripts/test-full-corpus-audit.mjs | sort)"
          printf 'Permanent diff:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push permanent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: enforce cross-record bridge integrity"
          git push origin HEAD:agent/strengthen-cross-record-bridge-integrity
