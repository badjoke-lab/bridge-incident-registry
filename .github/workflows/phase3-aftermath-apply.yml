name: Apply Phase 3 Aftermath Canonical Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-aftermath-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical migration
        run: node scripts/apply-phase3-aftermath-canonical.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate generated canonical state
        run: |
          set +e
          LOG="docs/audits/.phase3-aftermath-validation.log"
          : > "$LOG"
          STATUS=0
          for COMMAND in \
            "npm run check" \
            "npm run validate:data" \
            "npm run validate:enums" \
            "npm run audit:first-ten" \
            "npm run audit:full-corpus" \
            "npm run audit:full-corpus:test" \
            "npm run build" \
            "npm run dist:check" \
            "npm run dist:test"
          do
            echo "" | tee -a "$LOG"
            echo ">>> $COMMAND" | tee -a "$LOG"
            bash -lc "$COMMAND" 2>&1 | tee -a "$LOG"
            CODE=${PIPESTATUS[0]}
            if [ "$CODE" -ne 0 ]; then
              STATUS="$CODE"
              break
            fi
          done
          if [ "$STATUS" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$LOG"
            git commit -m "docs: capture Phase 3 aftermath validation failure [diagnostic]"
            git push origin HEAD:agent/phase3-aftermath-canonical
            exit "$STATUS"
          fi
          rm -f "$LOG"

      - name: Commit canonical changes
        run: |
          if git diff --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data SPEC.md src/pages/methodology/index.astro
          git commit -m "data: normalize Phase 3 aftermath records [aftermath-applied]"
          git push origin HEAD:agent/phase3-aftermath-canonical
