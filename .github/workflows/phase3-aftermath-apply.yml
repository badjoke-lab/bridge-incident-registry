name: Apply Phase 3 Aftermath Canonical Migration

on:
  push:
    branches:
      - agent/phase3-aftermath-canonical
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-aftermath-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical migration
        run: node scripts/apply-phase3-aftermath-canonical.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate generated canonical state
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:full-corpus:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Commit canonical changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/incidents.json \
            data/events.json \
            data/evidence.json \
            SPEC.md \
            src/pages/methodology/index.astro

          echo "Staged canonical migration:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "Expected canonical migration produced no staged changes."
            exit 1
          fi

          git commit -m "data: normalize Phase 3 aftermath records [aftermath-applied]"

          git fetch origin agent/phase3-aftermath-canonical
          git rebase origin/agent/phase3-aftermath-canonical
          git push --force-with-lease origin HEAD:agent/phase3-aftermath-canonical
