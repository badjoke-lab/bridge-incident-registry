name: Review Archive Batch 11

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/review-archive-batch11.mjs"
      - ".github/workflows/archive-batch11-review.yml"
      - "docs/audits/phase3-archive-capture-batch11-review-2026-08-03.md"
  workflow_dispatch:

concurrency:
  group: archive-batch11-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Review concrete Wayback captures
        run: node scripts/review-archive-batch11.mjs
