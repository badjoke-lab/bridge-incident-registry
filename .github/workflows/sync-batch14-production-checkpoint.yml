name: Sync Batch 14 Production Checkpoint

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch14-production-rerun
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-archive-capture-batch14-production-rerun
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Synchronize permanent checkpoint
        run: node scripts/sync-batch14-production-checkpoint.mjs

      - name: Assert bounded documentation diff
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            README.md \
            docs/audits/production-verification-phase3-archive-capture-batch14-2026-08-05.md \
            docs/operations/current-position.md \
            docs/operations/current-schedule.md \
            docs/runbooks/current-status.md \
            docs/runbooks/development-roadmap.md \
            docs/runbooks/recovery-checkpoint.md | sort)"
          test "$changed" = "$expected"

      - name: Run full repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Remove temporary checkpoint tools
        run: |
          rm scripts/sync-batch14-production-checkpoint.mjs
          rm .github/workflows/verify-production-batch14-rerun-macos.yml
          rm .github/workflows/sync-batch14-production-checkpoint.yml

      - name: Commit permanent checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/audits/production-verification-phase3-archive-capture-batch14-2026-08-05.md docs/operations/current-position.md docs/operations/current-schedule.md docs/runbooks/current-status.md docs/runbooks/development-roadmap.md docs/runbooks/recovery-checkpoint.md
          git add -u scripts/sync-batch14-production-checkpoint.mjs .github/workflows/verify-production-batch14-rerun-macos.yml .github/workflows/sync-batch14-production-checkpoint.yml
          git commit -m "verification: complete Batch 14 production checkpoint"
          git push origin HEAD:agent/phase3-archive-capture-batch14-production-rerun
