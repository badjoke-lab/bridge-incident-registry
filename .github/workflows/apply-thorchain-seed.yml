name: Apply THORChain seed

on:
  push:
    branches:
      - seed-thorchain
    paths:
      - scripts/append-thorchain-events.mjs
      - scripts/append-thorchain-evidence.mjs
      - .github/workflows/apply-thorchain-seed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-thorchain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/append-thorchain-events.mjs
      - run: node scripts/append-thorchain-evidence.mjs
      - name: Remove one-shot files
        run: rm scripts/append-thorchain-events.mjs scripts/append-thorchain-evidence.mjs .github/workflows/apply-thorchain-seed.yml
      - name: Commit generated canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/evidence.json scripts .github/workflows
          git commit -m "data: add THORChain events and evidence"
          git push origin HEAD:seed-thorchain
