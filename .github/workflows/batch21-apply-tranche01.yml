name: Batch 21 tranche 01 apply

on:
  push:
    branches:
      - canonical/growth-batch-21-incident-heavy
    paths:
      - scripts/batch21-apply-tranche01-v2.mjs
      - .github/workflows/batch21-apply-tranche01.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-21-incident-heavy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/batch21-apply-tranche01-v2.mjs
      - run: npm install
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - run: npm run audit:full-corpus
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Apply Batch 21 incident-heavy tranche 01"
          git push origin HEAD:canonical/growth-batch-21-incident-heavy
