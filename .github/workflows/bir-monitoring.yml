name: BIR Monitoring

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bir-monitoring.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when another monitoring review PR or pending review branch exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Avoid duplicate monitoring review work
        id: duplicate
        shell: bash
        run: |
          force="${{ inputs.force || false }}"
          open_count="$(gh pr list --state open --search 'in:title "Auto monitoring report:"' --json number --jq 'length')"

          git fetch --prune origin '+refs/heads/auto/monitoring/*:refs/remotes/origin/auto/monitoring/*' || true
          pending_branch_count=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            sha="$(git rev-parse "$ref")"
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              pending_branch_count=$((pending_branch_count + 1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/auto/monitoring/)

          if [ "$force" != "true" ] && { [ "$open_count" -gt 0 ] || [ "$pending_branch_count" -gt 0 ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Monitoring review work already exists (open_prs=$open_count, pending_branches=$pending_branch_count); this run will not create another."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect review issues
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          mkdir -p .monitor-input
          gh issue list --state open --limit 100 --json number,title,body,url,labels,updatedAt > .monitor-input/github-issues.json

      - name: Run guarded monitoring
        if: steps.duplicate.outputs.skip != 'true'
        id: monitor
        shell: bash
        run: |
          date_key="$(date -u +%Y%m%d)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_id="gh-${GITHUB_RUN_ID}"
          npm run monitoring:run -- \
            --issues .monitor-input/github-issues.json \
            --date "$date_key" \
            --run-id "$run_id" \
            --observed-at "$observed_at" \
            --result .monitor-output/result.json
          has_changes="$(node -e "const r=require('./.monitor-output/result.json'); process.stdout.write(String(r.has_changes))")"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "date_key=$date_key" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Assert canonical data unchanged
        if: steps.duplicate.outputs.skip != 'true'
        run: git diff --exit-code -- data/bridges.json data/incidents.json data/events.json data/evidence.json

      - name: Prepare permanent review-only diff
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes == 'true'
        shell: bash
        run: |
          rm -rf .monitor-input .monitor-output
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf 'Monitoring diff:\n%s\n' "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              data-staging/monitoring/*|data-staging/watchlists/auto/*) ;;
              *) echo "Unexpected monitoring path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Queue review when signals changed
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes == 'true'
        shell: bash
        run: |
          branch="auto/monitoring/${{ steps.monitor.outputs.date_key }}-${{ steps.monitor.outputs.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data-staging/monitoring data-staging/watchlists/auto
          git commit -m "monitoring: record ${{ steps.monitor.outputs.date_key }} signals"
          git push origin "$branch"

          summary="$(find "data-staging/monitoring/${{ steps.monitor.outputs.date_key }}" -name summary.md -type f | sort | tail -n 1)"
          body_file="$(mktemp)"
          {
            echo "## Review-only monitoring output"
            echo
            echo "This PR was generated by BIR Monitoring. It does not modify canonical bridge, incident, event, or evidence data."
            echo
            cat "$summary"
            echo
            echo "## Operator boundary"
            echo
            echo "Merge only to retain the monitoring signal/state. Any canonical investigation or record change requires a separate reviewed branch and PR."
          } > "$body_file"

          set +e
          pr_output="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Auto monitoring report: ${{ steps.monitor.outputs.date_key }}" \
            --body-file "$body_file" 2>&1)"
          pr_status=$?
          set -e

          if [ "$pr_status" -eq 0 ]; then
            printf '%s\n' "$pr_output"
            exit 0
          fi

          if grep -q "GitHub Actions is not permitted to create or approve pull requests" <<< "$pr_output"; then
            echo "::warning::GitHub Actions cannot create pull requests under the current repository setting. Review branch retained: $branch"
            {
              echo "### Monitoring review branch retained"
              echo
              echo "GitHub Actions is currently not permitted to create pull requests."
              echo
              echo "Review branch: \`$branch\`"
              echo
              echo "The branch contains only the already-validated review-only monitoring paths. A repository operator or connected app can open the PR later."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s\n' "$pr_output" >&2
          exit "$pr_status"

      - name: No changed signals
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes != 'true'
        run: echo "No new or changed review signals; no PR or review branch created."
