name: BIR Monitoring

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bir-monitoring.yml
      - scripts/monitoring/**
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when another monitoring review PR or pending review branch exists
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Avoid duplicate monitoring review work
        id: duplicate
        shell: bash
        run: |
          force="${{ inputs.force || false }}"
          open_count="$(gh pr list --state open --search 'in:title "Auto monitoring report:"' --json number --jq 'length')"
          git fetch --prune origin '+refs/heads/auto/monitoring/*:refs/remotes/origin/auto/monitoring/*' || true
          pending_branch_count=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            sha="$(git rev-parse "$ref")"
            if ! git merge-base --is-ancestor "$sha" origin/main; then pending_branch_count=$((pending_branch_count + 1)); fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/auto/monitoring/)
          if [ "$force" != "true" ] && { [ "$open_count" -gt 0 ] || [ "$pending_branch_count" -gt 0 ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Monitoring review work already exists (open_prs=$open_count, pending_branches=$pending_branch_count); this run will not create another."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect review issues
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          mkdir -p .monitor-input
          gh issue list --state open --limit 100 --json number,title,body,url,labels,updatedAt > .monitor-input/github-issues.json

      - name: Collect external bridge registry
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          source_url="https://raw.githubusercontent.com/DefiLlama/bridges-server/master/src/data/bridgeNetworkData.ts"
          output=".monitor-input/defillama-bridgeNetworkData.ts"
          if curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 45 \
            -H "User-Agent: BIR-review-monitor/1" "$source_url" -o "$output"; then
            echo "Collected external bridge registry: $(wc -c < "$output") bytes"
          else
            rm -f "$output"
            echo "::warning::External bridge registry was unavailable; candidate discovery is skipped for this run."
          fi

      - name: Collect DefiLlama hacks discovery data
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          raw=".monitor-input/defillama-hacks.json"
          output=".monitor-input/defillama-hacks.html"
          if curl --fail --location --silent --show-error --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 45 \
            -H "User-Agent: BIR-review-monitor/1" -H "Accept: application/json" \
            "https://api.llama.fi/hacks" -o "$raw" && \
            RAW="$raw" OUT="$output" node -e '
              const fs = require("fs");
              const parsed = JSON.parse(fs.readFileSync(process.env.RAW, "utf8"));
              if (!parsed || typeof parsed !== "object") process.exit(2);
              const next = { props: { pageProps: { data: parsed } } };
              fs.writeFileSync(process.env.OUT, `<script id="__NEXT_DATA__" type="application/json">${JSON.stringify(next)}</script>`);
            '; then
            rm -f "$raw"
            echo "Collected legacy public DefiLlama hacks JSON and normalized it for the guarded parser: $(wc -c < "$output") bytes"
          else
            rm -f "$raw" "$output"
            echo "Legacy public hacks JSON unavailable; trying public page fallback."
            if curl --fail --location --silent --show-error --retry 1 --retry-delay 2 --connect-timeout 10 --max-time 45 \
              -H "User-Agent: Mozilla/5.0 (compatible; BIR-review-monitor/1; +https://bir.badjoke-lab.com/)" \
              -H "Accept: text/html,application/xhtml+xml" \
              "https://defillama.com/hacks" -o "$output" && grep -q '__NEXT_DATA__' "$output"; then
              echo "Collected DefiLlama public hacks page fallback: $(wc -c < "$output") bytes"
            else
              rm -f "$output"
              echo "::warning::DefiLlama hacks JSON and public-page fallback were both unavailable; incident-feed adapter is skipped for this run."
            fi
          fi

      - name: Run guarded monitoring
        if: steps.duplicate.outputs.skip != 'true'
        id: monitor
        shell: bash
        run: |
          date_key="$(date -u +%Y%m%d)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_id="gh-${GITHUB_RUN_ID}"
          monitor_args=()
          if [ -s .monitor-input/defillama-bridgeNetworkData.ts ]; then
            monitor_args+=(
              --external-bridge-source .monitor-input/defillama-bridgeNetworkData.ts
              --external-bridge-source-url https://raw.githubusercontent.com/DefiLlama/bridges-server/master/src/data/bridgeNetworkData.ts
              --external-candidate-limit 8
            )
          fi
          if [ -s .monitor-input/defillama-hacks.html ]; then
            monitor_args+=(
              --defillama-hacks-page-input .monitor-input/defillama-hacks.html
              --defillama-hacks-candidate-limit 8
            )
          fi
          npm run monitoring:run -- \
            --issues .monitor-input/github-issues.json \
            --evidence-health \
            --evidence-probe-limit 12 \
            "${monitor_args[@]}" \
            --date "$date_key" \
            --run-id "$run_id" \
            --observed-at "$observed_at" \
            --result .monitor-output/result.json
          has_changes="$(node -e "const r=require('./.monitor-output/result.json'); process.stdout.write(String(r.has_changes))")"
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "date_key=$date_key" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Assert canonical data unchanged
        if: steps.duplicate.outputs.skip != 'true'
        run: git diff --exit-code -- data/bridges.json data/incidents.json data/events.json data/evidence.json

      - name: Prepare permanent review-only diff
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes == 'true'
        shell: bash
        run: |
          rm -rf .monitor-input .monitor-output
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf 'Monitoring diff:\n%s\n' "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              data-staging/monitoring/*|data-staging/watchlists/auto/*) ;;
              *) echo "Unexpected monitoring path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Queue review when monitoring state changes
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes == 'true'
        shell: bash
        run: |
          branch="auto/monitoring/${{ steps.monitor.outputs.date_key }}-${{ steps.monitor.outputs.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data-staging/monitoring data-staging/watchlists/auto
          git commit -m "monitoring: record ${{ steps.monitor.outputs.date_key }} signals"
          git push origin "$branch"
          summary="$(find "data-staging/monitoring/${{ steps.monitor.outputs.date_key }}" -name summary.md -type f | sort | tail -n 1)"
          body_file="$(mktemp)"
          {
            echo "## Review-only monitoring output"; echo
            echo "This PR was generated by BIR Monitoring. It does not modify canonical bridge, incident, event, or evidence data."; echo
            cat "$summary"; echo
            echo "## Operator boundary"; echo
            echo "Merge only to retain the monitoring signal/state. Any canonical investigation or record change requires a separate reviewed branch and PR."
          } > "$body_file"
          set +e
          pr_output="$(gh pr create --base main --head "$branch" --title "Auto monitoring report: ${{ steps.monitor.outputs.date_key }}" --body-file "$body_file" 2>&1)"
          pr_status=$?
          set -e
          if [ "$pr_status" -eq 0 ]; then printf '%s\n' "$pr_output"; exit 0; fi
          if grep -q "GitHub Actions is not permitted to create or approve pull requests" <<< "$pr_output"; then
            echo "::warning::GitHub Actions cannot create pull requests under the current repository setting. Review branch retained: $branch"
            {
              echo "### Monitoring review branch retained"; echo
              echo "GitHub Actions is currently not permitted to create pull requests."; echo
              echo "Review branch: \`$branch\`"; echo
              echo "The branch contains only the already-validated review-only monitoring paths. A repository operator or connected app can open the PR later."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s\n' "$pr_output" >&2
          exit "$pr_status"

      - name: No monitoring state changes
        if: steps.duplicate.outputs.skip != 'true' && steps.monitor.outputs.has_changes != 'true'
        run: echo "No new or changed monitoring state; no PR or review branch created."
