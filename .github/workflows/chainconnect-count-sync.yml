name: Stage ChainConnect Count Sync

on:
  push:
    branches:
      - chainconnect-2026-application
    paths:
      - .github/workflows/chainconnect-count-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chainconnect-2026-application
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync count-bearing documents to reviewed canonical counts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'README.md',
            'docs/runbooks/current-status.md',
            'docs/runbooks/recovery-checkpoint.md',
            'docs/runbooks/development-roadmap.md',
            'docs/runbooks/public-consistency-remediation.md'
          ];
          const replacements = [
            [/Bridges(\s+)37\b/g, 'Bridges$138'],
            [/Incidents(\s+)39\b/g, 'Incidents$140'],
            [/Events(\s+)191\b/g, 'Events$1193'],
            [/Evidence(\s+)303\b/g, 'Evidence$1311']
          ];
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            const before = text;
            for (const [pattern, replacement] of replacements) text = text.replace(pattern, replacement);
            if (text === before) throw new Error(`${file}: no current canonical count block replaced`);
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify canonical and documentation consistency
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run build
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
          git diff --check
      - name: Commit validated document sync to branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git commit -m "docs: sync BIR canonical counts through ChainConnect"
          git push origin HEAD:chainconnect-2026-application
