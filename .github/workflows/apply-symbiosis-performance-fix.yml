name: Apply Symbiosis performance fix

on:
  push:
    branches:
      - canonical/symbiosis-2026-bsc-incident

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/symbiosis-2026-bsc-incident
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/trim-symbiosis-incident-summary.mjs
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - run: npm run build
      - run: npm run performance:check
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/incidents.json
          git commit -m "Trim Symbiosis incident list copy"
          git push origin HEAD:canonical/symbiosis-2026-bsc-incident
