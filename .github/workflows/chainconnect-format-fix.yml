name: Stage ChainConnect Formatting Fix

on:
  push:
    branches:
      - chainconnect-2026-application
    paths:
      - .github/workflows/chainconnect-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chainconnect-2026-application
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore canonical one-record-per-line JSON formatting
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/incidents.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const text = '[\n' + data.map((record) => `  ${JSON.stringify(record)}`).join(',\n') + '\n]\n';
          fs.writeFileSync(path, text);
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate compact canonical output
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run build
          npm run performance:check
          git diff --check
      - name: Commit validated formatting fix to branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "data: restore compact incident canonical formatting"
          git push origin HEAD:chainconnect-2026-application
