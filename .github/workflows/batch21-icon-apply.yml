name: Batch 21 ICON/SODAX apply

on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-04-icon
    paths:
      - scripts/batch21-apply-icon.mjs
      - .github/workflows/batch21-icon-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-21-tranche-04-icon
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/batch21-apply-icon.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical ICON/SODAX records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Add ICON/SODAX canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-04-icon
