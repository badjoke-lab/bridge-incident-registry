name: Apply Archive Deferred Retry 02 v2

on:
  push:
    branches:
      - agent/phase3-archive-deferred-retry-02-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact mapping and ceiling
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const archiveUrl = 'https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417';
          const evidencePath = 'data/evidence.json';
          let text = fs.readFileSync(evidencePath, 'utf8');
          let hits = 0;
          text = text.split('\n').map((line) => {
            if (!line.includes('"id":"bir_src_000166"')) return line;
            hits += 1;
            if (!line.includes('"archived_url":null')) throw new Error('Unexpected archived_url boundary for bir_src_000166');
            return line.replace('"archived_url":null', `"archived_url":"${archiveUrl}"`);
          }).join('\n');
          if (hits !== 1) throw new Error(`Expected exactly one target record, found ${hits}`);
          fs.writeFileSync(evidencePath, text);

          const qualityPath = 'scripts/check-source-quality-baseline.mjs';
          let quality = fs.readFileSync(qualityPath, 'utf8');
          if ((quality.match(/  risky_host_unarchived: 17,/g) ?? []).length !== 1) throw new Error('Unexpected risky-host ceiling boundary');
          quality = quality.replace('  risky_host_unarchived: 17,', '  risky_host_unarchived: 16,');
          if (!quality.includes('  terminal_unarchived: 15,')) throw new Error('Terminal ceiling moved unexpectedly');
          fs.writeFileSync(qualityPath, quality);
          NODE

      - name: Assert exact metrics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('data/evidence.json', 'utf8'));
          const bridges = JSON.parse(fs.readFileSync('data/bridges.json', 'utf8'));
          const bridgesById = new Map(bridges.map((x) => [x.id, x]));
          const terminal = new Set(['dead','deprecated','migrated']);
          const riskyHosts = ['x.com','twitter.com','medium.com','mirror.xyz','substack.com','docs.google.com','notion.site'];
          const host = (url) => { try { return new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch { return 'invalid-url'; } };
          const hasArchive = (x) => typeof x.archived_url === 'string' && x.archived_url.trim().length > 0;
          const isRisky = (h) => riskyHosts.some((base) => h === base || h.endsWith(`.${base}`));
          const uniqueUrls = (rows) => new Set(rows.map((x) => { try { return new URL(x.url).toString(); } catch { return x.url; } })).size;
          const terminalRows = evidence.filter((x) => terminal.has(bridgesById.get(x.bridge_id)?.status) && !hasArchive(x));
          const riskyRows = evidence.filter((x) => isRisky(host(x.url)) && !hasArchive(x));
          const twitterRows = evidence.filter((x) => ['x.com','twitter.com'].includes(host(x.url)) && !hasArchive(x));
          const observed = {
            archived: evidence.filter(hasArchive).length,
            terminal_unique: uniqueUrls(terminalRows),
            terminal_records: terminalRows.length,
            risky_unique: uniqueUrls(riskyRows),
            risky_records: riskyRows.length,
            twitter_records: twitterRows.length
          };
          const expected = { archived:127, terminal_unique:15, terminal_records:25, risky_unique:16, risky_records:30, twitter_records:29 };
          if (JSON.stringify(observed) !== JSON.stringify(expected)) throw new Error(`Metric mismatch: ${JSON.stringify(observed)} != ${JSON.stringify(expected)}`);
          console.log(JSON.stringify(observed, null, 2));
          NODE

      - name: Install dependencies
        run: npm install

      - name: Run full repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Write audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.mkdirSync('docs/audits', { recursive: true });
          const lines = [
            '# Phase 3 — Archive Deferred Retry 02 Canonical Application',
            '',
            'Date: 2026-08-09',
            `GitHub Actions run: ${process.env.GITHUB_RUN_ID}`,
            'Review PR: #202',
            'Review run: 31267768565',
            '',
            '## Scope',
            '',
            'This canonical pass applies exactly one reproducible archive mapping approved by Deferred Archive Retry 02. No acceptance boundary was weakened.',
            '',
            '- Evidence: `bir_src_000166`',
            '- Source: `https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`',
            '- Archive: `https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`',
            '- Replay: HTTP 200 HTML, 155,612 bytes in both independent review passes',
            '',
            '## Canonical effect',
            '',
            '- evidence records with `archived_url`: 126 → 127',
            '- terminal unarchived unique URLs: 15 → 15',
            '- terminal unarchived records: 25 → 25',
            '- risky-host unarchived unique URLs: 17 → 16',
            '- risky-host unarchived records: 31 → 30',
            '- X/Twitter unarchived records: 29 → 29',
            '',
            'The source-quality no-regression ceiling is tightened only for `risky_host_unarchived`, from 17 to 16. The terminal ceiling remains 15.',
            '',
            '## Validation',
            '',
            'The applicator asserted the exact target ID, archive URL, and projected archive-risk metrics, then ran the complete repository check sequence used by `.github/workflows/check.yml`.',
            '',
            '## Safety boundary',
            '',
            'The temporary applicator workflow removes itself before commit. The permanent branch diff is restricted to canonical evidence, the tightened source-quality ceiling, and this audit document.',
            ''
          ];
          fs.writeFileSync('docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md', lines.join('\n'));
          NODE

      - name: Remove one-shot workflow and assert scope
        run: |
          rm .github/workflows/apply-archive-deferred-retry-02-v2.yml
          git fetch origin main
          actual="$(git diff --name-only origin/main -- . | sort)"
          expected="$(printf '%s\n' \
            'data/evidence.json' \
            'docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md' \
            'scripts/check-source-quality-baseline.mjs' | sort)"
          printf 'Final diff:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: apply deferred archive retry 02'
          git push origin HEAD:agent/phase3-archive-deferred-retry-02-canonical
