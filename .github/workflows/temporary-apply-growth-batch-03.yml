name: Temporary Apply Growth Batch 03

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'canonical/growth-batch-03-bxh-cellframe-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply canonical Batch 03
        run: node scripts/apply-growth-batch-03.mjs
      - name: Validate canonical data
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
      - name: Build and public consistency
        run: |
          npm run check
          npm run build
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
      - name: Commit canonical output and remove temporary machinery
        run: |
          rm scripts/apply-growth-batch-03.mjs
          rm .github/workflows/temporary-apply-growth-batch-03.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'DATA: add BXH 2022 and Cellframe 2026 incidents'
          git push origin HEAD:${{ github.head_ref }}
