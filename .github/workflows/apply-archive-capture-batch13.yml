name: Apply Archive Capture Batch 13

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch13-canonical
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-archive-capture-batch13
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bounded canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-archive-capture-batch13-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply exact reviewed mappings
        run: node scripts/apply-archive-capture-batch13.mjs

      - name: Assert bounded mutation
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/evidence.json scripts/check-source-quality-baseline.mjs | sort)"
          test "$changed" = "$expected"

      - name: Run full canonical checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Remove temporary applicator and workflow
        run: |
          rm scripts/apply-archive-capture-batch13.mjs
          rm .github/workflows/apply-archive-capture-batch13.yml

      - name: Commit canonical result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence.json scripts/check-source-quality-baseline.mjs
          git add -u scripts/apply-archive-capture-batch13.mjs .github/workflows/apply-archive-capture-batch13.yml
          git commit -m "data: apply verified archive capture Batch 13"
          git push origin HEAD:agent/phase3-archive-capture-batch13-canonical
