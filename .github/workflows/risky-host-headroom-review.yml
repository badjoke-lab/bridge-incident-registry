name: Risky Host Headroom Review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/risky-host-headroom-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Wormhole first-party incident report authority
        shell: bash
        run: |
          set -euo pipefail

          candidates=(
            'https://wormhole.com/reports/2022-02-02-exploit-report/'
            'https://wormholecrypto.medium.com/wormhole-incident-report-02-02-22-ad9b8f21eec6'
          )

          accepted=0
          for url in "${candidates[@]}"; do
            echo "=== PROBE $url ==="
            for pass in 1 2; do
              tmpdir="$(mktemp -d)"
              set +e
              meta="$(curl --silent --show-error --location \
                --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
                --user-agent 'Mozilla/5.0 BIR source verification' \
                --dump-header "$tmpdir/headers" --output "$tmpdir/body" \
                --write-out '%{http_code}|%{url_effective}|%{content_type}' "$url")"
              rc=$?
              set -e
              bytes="$(wc -c < "$tmpdir/body" 2>/dev/null || echo 0)"
              echo "PASS=$pass RC=$rc META=$meta BYTES=$bytes"

              http="${meta%%|*}"
              rest="${meta#*|}"
              effective="${rest%%|*}"
              ctype="${rest#*|}"

              if [[ "$rc" -ne 0 || "$http" != "200" || "$ctype" != *"text/html"* ]]; then
                echo "PROBE_REJECT pass=$pass reason=transport_or_response_contract"
                rm -rf "$tmpdir"
                break
              fi

              python3 - "$tmpdir/body" <<'PY'
import html, re, sys
raw = open(sys.argv[1], 'r', encoding='utf-8', errors='ignore').read()
text = html.unescape(re.sub(r'<[^>]+>', ' ', raw))
text = re.sub(r'\s+', ' ', text).lower()
markers = {
    'incident_report': ('wormhole' in text and 'incident report' in text),
    'amount': ('120,000' in text or '120k' in text or '120000' in text),
    'restart': ('13:29' in text or 'back online' in text or 'brought back online' in text),
}
print('MARKERS=' + ','.join(f'{k}:{int(v)}' for k, v in markers.items()))
if not all(markers.values()):
    raise SystemExit(2)
PY
              marker_rc=$?
              if [[ "$marker_rc" -ne 0 ]]; then
                echo "PROBE_REJECT pass=$pass reason=missing_claim_markers effective=$effective"
                rm -rf "$tmpdir"
                break
              fi

              echo "PROBE_ACCEPT pass=$pass effective=$effective bytes=$bytes"
              rm -rf "$tmpdir"
              if [[ "$pass" -eq 2 ]]; then
                echo "REPRODUCIBLY_ACCEPTED_FIRST_PARTY_SOURCE=$url"
                accepted=1
              fi
            done
            if [[ "$accepted" -eq 1 ]]; then
              exit 0
            fi
          done

          echo 'No candidate reproduced the required first-party incident + amount + restart claim set.' >&2
          exit 1
