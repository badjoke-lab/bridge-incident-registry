name: Apply Archive Deferred Retry 02

on:
  push:
    branches:
      - agent/phase3-archive-deferred-retry-02-canonical
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-archive-deferred-retry-02
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded canonical mapping
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const evidencePath = 'data/evidence.json';
          const qualityPath = 'scripts/check-source-quality-baseline.mjs';
          const archiveUrl = 'https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417';

          let evidence = fs.readFileSync(evidencePath, 'utf8');
          let hits = 0;
          evidence = evidence.split('\n').map((line) => {
            if (!line.includes('"id":"bir_src_000166"')) return line;
            hits += 1;
            if (!line.includes('"archived_url":null')) {
              throw new Error('bir_src_000166 does not have the expected null archived_url boundary');
            }
            return line.replace('"archived_url":null', `"archived_url":"${archiveUrl}"`);
          }).join('\n');
          if (hits !== 1) throw new Error(`Expected exactly one bir_src_000166 record, found ${hits}`);
          fs.writeFileSync(evidencePath, evidence);

          let quality = fs.readFileSync(qualityPath, 'utf8');
          const oldNeedle = '  risky_host_unarchived: 17,';
          const occurrences = quality.split(oldNeedle).length - 1;
          if (occurrences !== 1) throw new Error(`Expected one risky-host ceiling boundary, found ${occurrences}`);
          quality = quality.replace(oldNeedle, '  risky_host_unarchived: 16,');
          if (!quality.includes('  terminal_unarchived: 15,')) throw new Error('Terminal ceiling moved unexpectedly');
          fs.writeFileSync(qualityPath, quality);
          NODE

      - name: Assert exact projected metrics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('data/evidence.json', 'utf8'));
          const bridges = JSON.parse(fs.readFileSync('data/bridges.json', 'utf8'));
          const bridgesById = new Map(bridges.map((item) => [item.id, item]));
          const terminalStatuses = new Set(['dead', 'deprecated', 'migrated']);
          const riskyHosts = ['x.com','twitter.com','medium.com','mirror.xyz','substack.com','docs.google.com','notion.site'];
          const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, '').toLowerCase(); } catch { return 'invalid-url'; } };
          const risky = (host) => riskyHosts.some((base) => host === base || host.endsWith(`.${base}`));
          const hasArchive = (source) => typeof source.archived_url === 'string' && source.archived_url.trim().length > 0;
          const normalized = (url) => { try { return new URL(url).toString(); } catch { return url; } };
          const uniqueCount = (records) => new Set(records.map((item) => normalized(item.url))).size;

          const target = evidence.find((item) => item.id === 'bir_src_000166');
          const expectedArchive = 'https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417';
          if (!target || target.archived_url !== expectedArchive) throw new Error('Target archive mapping mismatch');

          const terminalRecords = evidence.filter((source) => terminalStatuses.has(bridgesById.get(source.bridge_id)?.status) && !hasArchive(source));
          const riskyRecords = evidence.filter((source) => risky(hostOf(source.url)) && !hasArchive(source));
          const twitterRecords = evidence.filter((source) => ['x.com','twitter.com'].includes(hostOf(source.url)) && !hasArchive(source));
          const metrics = {
            archived: evidence.filter(hasArchive).length,
            terminal_unique: uniqueCount(terminalRecords),
            terminal_records: terminalRecords.length,
            risky_unique: uniqueCount(riskyRecords),
            risky_records: riskyRecords.length,
            twitter_records: twitterRecords.length
          };
          const expected = { archived: 127, terminal_unique: 15, terminal_records: 25, risky_unique: 16, risky_records: 30, twitter_records: 29 };
          if (JSON.stringify(metrics) !== JSON.stringify(expected)) {
            throw new Error(`Projected metric mismatch: observed ${JSON.stringify(metrics)} expected ${JSON.stringify(expected)}`);
          }
          console.log(JSON.stringify(metrics, null, 2));
          NODE

      - name: Install dependencies
        run: npm install

      - name: Run full repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Write permanent canonical audit
        run: |
          mkdir -p docs/audits
          cat > docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md <<EOF
          # Phase 3 — Archive Deferred Retry 02 Canonical Application

          Date: 2026-08-09
          GitHub Actions run: ${GITHUB_RUN_ID}
          Review PR: #202
          Review run: 31267768565

          ## Scope

          This canonical pass applies exactly one reproducible archive mapping approved by Deferred Archive Retry 02. No acceptance boundary was weakened.

          - Evidence: `bir_src_000166`
          - Source: `https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`
          - Archive: `https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`
          - Replay: HTTP 200 HTML, 155,612 bytes in both independent review passes

          ## Canonical effect

          - evidence records with `archived_url`: 126 → 127
          - terminal unarchived unique URLs: 15 → 15
          - terminal unarchived records: 25 → 25
          - risky-host unarchived unique URLs: 17 → 16
          - risky-host unarchived records: 31 → 30
          - X/Twitter unarchived records: 29 → 29

          The source-quality no-regression ceiling is tightened only for `risky_host_unarchived`, from 17 to 16. The terminal ceiling remains 15.

          ## Validation

          The applicator asserted the exact target ID and archive URL, exact projected archive-risk metrics, then ran the complete repository check sequence used by `.github/workflows/check.yml`, including canonical/schema validation, corpus/source-count/source-quality audits and failure tests, production-content equality tests, static build, and dist consistency tests.

          ## Safety boundary

          The temporary applicator workflow removes itself before commit. The permanent branch diff is restricted to canonical evidence, the tightened source-quality ceiling, and this audit document.
          EOF

      - name: Remove one-shot applicator and assert final scope
        run: |
          rm .github/workflows/apply-archive-deferred-retry-02.yml
          git fetch origin main
          actual="$(git diff --name-only origin/main -- . | sort)"
          expected="$(printf '%s\n' \
            'data/evidence.json' \
            'docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md' \
            'scripts/check-source-quality-baseline.mjs' | sort)"
          printf 'Final diff:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push canonical application
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: apply deferred archive retry 02'
          git push origin HEAD:agent/phase3-archive-deferred-retry-02-canonical
