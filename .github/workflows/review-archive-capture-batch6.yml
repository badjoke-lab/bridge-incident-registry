name: Review Archive Capture Batch 6

on:
  pull_request:
    paths:
      - "scripts/review-archive-capture-batch6.mjs"
      - ".github/workflows/review-archive-capture-batch6.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-capture-batch6-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-archive-capture-batch6-review
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Wayback candidates
        run: node scripts/review-archive-capture-batch6.mjs

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/phase3-archive-capture-batch6-candidate-verification.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: capture archive Batch 6 candidate verification [inventory]"
          git pull --rebase origin agent/phase3-archive-capture-batch6-review
          git push origin HEAD:agent/phase3-archive-capture-batch6-review
