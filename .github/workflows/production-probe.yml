name: Production Probe

on:
  pull_request:
    paths:
      - ".github/workflows/production-probe.yml"
      - "docs/audits/production-verification-batch6b-2026-07-28.md"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production state
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request

          origin = "https://bridge-incident-registry.pages.dev"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Cache-Control": "no-cache",
          }
          paths = [
              "/version.json",
              "/data/manifest.json",
              "/data/reference/assets.json",
              "/sitemap.xml",
              "/bridge/rubic/",
              "/bridge/unizen/",
              "/incident/rubic-2022-rbc-brbc-bridge-wallet-compromise/",
              "/incident/rubic-2022-rubicproxy-approval-exploit/",
              "/incident/unizen-2024-external-call-approval-exploit/",
          ]
          for path in paths:
              request = urllib.request.Request(origin + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8", "replace")
                      print("PROBE", path, response.status, response.headers.get("content-type"), response.headers.get("cf-cache-status"), len(body))
                      if path in ("/version.json", "/data/manifest.json"):
                          parsed = json.loads(body)
                          print("COUNTS", json.dumps(parsed.get("record_counts"), sort_keys=True), "GENERATED", parsed.get("generated_at"))
                      elif path == "/data/reference/assets.json":
                          parsed = json.loads(body)
                          print("ASSETS", "rbc" in parsed, "brbc" in parsed, len(parsed))
                      elif path == "/sitemap.xml":
                          print("SITEMAP_LOCS", len(re.findall(r"<loc>", body)))
                      else:
                          print("CANONICAL", re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', body).group(1) if re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)', body) else "missing")
              except urllib.error.HTTPError as error:
                  print("PROBE", path, error.code, error.headers.get("content-type"), error.headers.get("cf-cache-status"))
                  print("BODY", error.read(300).decode("utf-8", "replace").replace("\n", " "))
              except Exception as error:
                  print("PROBE", path, "ERROR", type(error).__name__, str(error))
          PY
