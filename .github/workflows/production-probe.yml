name: Production Probe

on:
  pull_request:
    paths:
      - ".github/workflows/production-probe.yml"
      - "docs/audits/production-verification-batch6a-2026-07-28.md"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production state
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          origin = "https://bridge-incident-registry.pages.dev"
          paths = [
              "/version.json",
              "/data/manifest.json",
              "/bridge/transit-swap/",
              "/bridge/magpie-protocol/",
              "/incident/transit-swap-2022-routing-approval-exploit/",
              "/incident/magpie-protocol-2024-router-v2-exploit/",
          ]
          for path in paths:
              url = origin + path
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read(1000).decode("utf-8", "replace")
                      print("PROBE", path, response.status, response.headers.get("content-type"), response.headers.get("cf-cache-status"))
                      if path.endswith(".json"):
                          try:
                              parsed = json.loads(body)
                              print("BODY", json.dumps({
                                  "record_counts": parsed.get("record_counts"),
                                  "canonical_only": parsed.get("canonical_only"),
                                  "generated_at": parsed.get("generated_at"),
                              }, sort_keys=True))
                          except Exception:
                              print("BODY", body[:500].replace("\n", " "))
              except urllib.error.HTTPError as error:
                  print("PROBE", path, error.code, error.headers.get("content-type"), error.headers.get("cf-cache-status"))
                  print("BODY", error.read(300).decode("utf-8", "replace").replace("\n", " "))
              except Exception as error:
                  print("PROBE", path, "ERROR", type(error).__name__, str(error))
          PY
