name: Temporary Normalize Wanchain Vocabulary

on:
  push:
    branches:
      - canonical/wanchain-cardano-2026
    paths:
      - scripts/tmp-normalize-wanchain-vocab.mjs
      - .github/workflows/tmp-normalize-wanchain-vocab.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v7
        with:
          ref: canonical/wanchain-cardano-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Normalize bounded Wanchain records
        run: node scripts/tmp-normalize-wanchain-vocab.mjs

      - name: Validate normalized canonical data
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-schema-enums.mjs
          node scripts/audit-full-corpus.mjs
          node scripts/check-source-count-equality.mjs
          node scripts/check-source-quality-baseline.mjs

      - name: Commit normalized canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/incidents.json data/events.json data/evidence.json
          if git diff --cached --quiet; then
            echo 'Expected vocabulary normalization diff was not generated.' >&2
            exit 1
          fi
          git commit -m 'data: normalize Wanchain record vocabulary'
          git push origin HEAD:canonical/wanchain-cardano-2026
