name: Source Count Contract Inventory

on:
  push:
    branches:
      - agent/phase3-source-count-contract

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-source-count-contract
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate inventory
        run: node scripts/report-source-count-contract.mjs

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.source-count-contract.json docs/audits/.source-count-contract.md
          if git diff --cached --quiet; then
            echo "No inventory changes."
            exit 0
          fi
          git commit -m "docs: capture source-count contract inventory [inventory]"
          git push origin HEAD:agent/phase3-source-count-contract
