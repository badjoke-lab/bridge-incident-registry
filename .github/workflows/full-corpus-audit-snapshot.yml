name: Full Corpus Audit Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-full-corpus-audit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture audit output
        run: |
          node scripts/audit-full-corpus.mjs > docs/audits/.full-corpus-audit-output.txt 2>&1

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.full-corpus-audit-output.txt
          git commit -m "build: capture full-corpus audit snapshot [audit-snapshot]"
          git push origin HEAD:agent/phase3-full-corpus-audit
