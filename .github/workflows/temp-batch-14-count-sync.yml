name: TEMP Batch 14 Count Sync
on:
  push:
    branches:
      - canonical/growth-batch-14-arbitrum-bridge
    paths:
      - .github/workflows/temp-batch-14-count-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-14-arbitrum-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync current count blocks only
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files=[
            'README.md',
            'docs/runbooks/current-status.md',
            'docs/runbooks/recovery-checkpoint.md',
            'docs/runbooks/development-roadmap.md',
            'docs/runbooks/public-consistency-remediation.md',
          ]
          patterns=[
            (r'(?i)(Bridges\s*[:|]?\s*)66\b', r'\g<1>67'),
            (r'(?i)(Events\s*[:|]?\s*)240\b', r'\g<1>241'),
            (r'(?i)(Evidence\s*[:|]?\s*)393\b', r'\g<1>395'),
            (r'\b66\s+bridges\b', '67 bridges'),
            (r'\b240\s+events\b', '241 events'),
            (r'\b393\s+evidence\b', '395 evidence'),
          ]
          changed=[]
          for f in files:
            p=Path(f); s=p.read_text(); original=s
            for pat,repl in patterns: s=re.sub(pat,repl,s)
            if s != original:
              p.write_text(s); changed.append(f)
          if set(changed) != set(files):
            raise SystemExit(f'expected all five current-count docs to change; changed={changed}')
          print('synced', changed)
          PY
      - run: npm run build
      - run: npm run dist:check
      - name: Commit sync and remove helper
        run: |
          git rm -f .github/workflows/temp-batch-14-count-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git commit -m 'docs: sync Batch 14 canonical counts'
          git push origin HEAD:canonical/growth-batch-14-arbitrum-bridge
