name: Temporary Apply Growth Batch 02

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'canonical/growth-batch-02-anyswap-qan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-02-anyswap-qan
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply reviewed Batch 02
        run: node scripts/apply-record-growth-batch-02.mjs
      - name: Normalize QAN evidence publication metadata
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const p = 'data/evidence.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const claim = data.find(x => x.id === 'bir_src_000356');
          const repo = data.find(x => x.id === 'bir_src_000357');
          if (!claim || !repo) throw new Error('Batch 02 QAN evidence missing');
          claim.published_at = '2022-10';
          claim.published_at_precision = 'month';
          repo.published_at = '2021-10-30';
          repo.published_at_precision = 'day';
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');
          NODE
      - name: Sync count-bearing documentation
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const files = [
            'README.md',
            'docs/runbooks/current-status.md',
            'docs/runbooks/recovery-checkpoint.md',
            'docs/runbooks/development-roadmap.md',
            'docs/runbooks/public-consistency-remediation.md'
          ];
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            let s = fs.readFileSync(file, 'utf8');
            s = s.replace(/42 bridges \/ 47 incidents \/ 214 events \/ 352 evidence/g, '43 bridges / 49 incidents / 218 events / 356 evidence');
            s = s.replace(/Bridges\s+42/g, 'Bridges   43');
            s = s.replace(/Incidents\s+47/g, 'Incidents   49');
            s = s.replace(/Events\s+214/g, 'Events   218');
            s = s.replace(/Evidence\s+352/g, 'Evidence   356');
            fs.writeFileSync(file, s);
          }
          NODE
      - name: Validate canonical data
        run: npm run validate:data
      - name: Validate schema enums
        run: npm run validate:enums
      - name: Audit first ten seeds
        run: npm run audit:first-ten
      - name: Audit full canonical corpus
        run: npm run audit:full-corpus
      - name: Audit exact source counts
        run: npm run audit:source-count
      - name: Audit source quality baseline
        run: npm run audit:source-quality
      - name: Build static site
        run: npm run build
      - name: Check accessibility contract
        run: npm run accessibility:check
      - name: Enforce performance budget
        run: npm run performance:check
      - name: Check built output consistency
        run: npm run dist:check
      - name: Remove temporary applicator and workflow
        run: |
          rm scripts/apply-record-growth-batch-02.mjs
          rm .github/workflows/temp-apply-growth-batch-02.yml
      - name: Commit canonical Batch 02
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data README.md docs/runbooks scripts .github/workflows
          git commit -m 'Add record-growth Batch 02 incidents'
          git push origin HEAD:canonical/growth-batch-02-anyswap-qan
