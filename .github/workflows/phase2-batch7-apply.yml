name: Apply Phase 2 Batch 7

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/phase2-batch7-records

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-batch7-records
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical records
        run: node scripts/apply-phase2-batch7.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate generated canonical state
        run: |
          set +e
          LOG="docs/batches/.phase2-batch7-validation.log"
          : > "$LOG"
          status=0
          for command in \
            "npm run validate:data" \
            "npm run validate:enums" \
            "npm run audit:first-ten" \
            "npm run build" \
            "npm run dist:check" \
            "npm run dist:test"
          do
            echo "" | tee -a "$LOG"
            echo ">>> $command" | tee -a "$LOG"
            bash -lc "$command" 2>&1 | tee -a "$LOG"
            current=${PIPESTATUS[0]}
            if [ "$current" -ne 0 ]; then
              status="$current"
              break
            fi
          done
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$LOG"
            git commit -m "build: record Batch 7 validation failure [batch7-diagnostic]"
            git push origin HEAD:agent/phase2-batch7-records
            exit "$status"
          fi
          rm -f "$LOG"

      - name: Commit canonical changes
        run: |
          if git diff --quiet; then
            echo "No canonical changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md CHANGELOG.md docs/runbooks
          git commit -m "data: add Phase 2 Batch 7 records [batch7-applied]"
          git push origin HEAD:agent/phase2-batch7-records
