name: Verify Batch 15 Production Rerun on macOS

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch15-production-rerun
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-batch15-rerun
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify production registry
        env:
          PUBLIC_SITE_ORIGIN: https://bir.badjoke-lab.com
          BIR_PRODUCTION_TIMEOUT_MS: "30000"
          BIR_PUBLICATION_ATTEMPTS: "20"
          BIR_PUBLICATION_DELAY_MS: "15000"
        run: npm run production:verify
