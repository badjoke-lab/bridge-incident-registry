name: Source Quality Remediation Batch 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/phase3-source-quality-remediation-batch1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-source-quality-remediation-batch1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded canonical migration
        run: node scripts/apply-source-quality-remediation-batch1.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate canonical migration
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run build

      - name: Commit canonical migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/events.json data/evidence.json
          git commit -m "data: apply source quality remediation Batch 1 [canonical]"
          git push origin HEAD:agent/phase3-source-quality-remediation-batch1
