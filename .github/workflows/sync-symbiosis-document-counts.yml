name: Sync Symbiosis document counts

on:
  push:
    branches:
      - canonical/symbiosis-2026-bsc-incident

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/symbiosis-2026-bsc-incident
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/sync-pr-document-counts.mjs
      - run: npm run build
      - run: npm run performance:check
      - run: npm run dist:check
      - name: Commit documentation count sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git commit -m "Sync BIR canonical counts after Symbiosis incident"
          git push origin HEAD:canonical/symbiosis-2026-bsc-incident
