name: Batch 21 Ronin 2024 apply

on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-05-ronin-2024
    paths:
      - scripts/batch21-apply-ronin-2024.mjs
      - scripts/batch21-apply-ronin-2024-v2.mjs
      - .github/workflows/batch21-ronin-2024-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-21-tranche-05-ronin-2024
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/batch21-apply-ronin-2024.mjs
      - run: node scripts/batch21-apply-ronin-2024-v2.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical Ronin 2024 records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Add Ronin 2024 canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-05-ronin-2024
