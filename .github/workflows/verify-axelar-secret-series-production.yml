name: Verify Axelar-Secret Series Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-axelar-secret-series-production-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-series:
    if: github.head_ref == 'agent/production-verification'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pin exact merged main
        run: |
          test "$(git rev-parse HEAD)" = "7a2b051445b1248c4a6a46c8e337ef52d3cd78bd"
          test -f config/ledger-series-phase9-stage5-relationship-authority.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate exact-main Series output
        run: |
          set -euo pipefail
          npm run build
          node scripts/check-series-adapter.mjs
          node scripts/check-dist-consistency.mjs
          jq -e '.record_counts.primary_records == 40 and .record_counts.series_records == 83 and .routes.search == "/incidents/" and .routes.compare == "/compare/" and .routes.stats == "/stats/"' public/data/series/registry.json >/dev/null
          jq -e '.record_count == 83 and .record_counts.bridges == 40 and .record_counts.incidents == 43' public/data/series/index.json >/dev/null

      - name: Verify complete Series adapter on production
        env:
          SERIES_ORIGIN: https://bir.badjoke-lab.com
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = path.resolve('public/data/series');
          const origin = process.env.SERIES_ORIGIN;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const BATCH_SIZE = 12;
          const REQUEST_TIMEOUT_MS = 15000;

          function listJson(dir, base = dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const target = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...listJson(target, base));
              else if (entry.isFile() && entry.name.endsWith('.json')) out.push(path.relative(base, target).split(path.sep).join('/'));
            }
            return out.sort();
          }

          function normalize(value) {
            if (Array.isArray(value)) return value.map(normalize);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().filter((key) => key !== 'generated_at').map((key) => [key, normalize(value[key])]));
            }
            return value;
          }

          async function fetchJson(url) {
            const response = await fetch(url, {
              headers: { accept: 'application/json' },
              signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
            });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response.json();
          }

          const files = listJson(root);
          if (files.length !== 85) throw new Error(`expected 85 Series JSON files, found ${files.length}`);
          const local = new Map(files.map((file) => [file, normalize(JSON.parse(fs.readFileSync(path.join(root, file), 'utf8')))]));

          let lastError;
          for (let attempt = 1; attempt <= 30; attempt++) {
            try {
              for (let offset = 0; offset < files.length; offset += BATCH_SIZE) {
                const batch = files.slice(offset, offset + BATCH_SIZE);
                await Promise.all(batch.map(async (file) => {
                  const url = `${origin}/data/series/${file}?verify=axelar-secret-${attempt}-${Date.now()}`;
                  const remote = normalize(await fetchJson(url));
                  if (JSON.stringify(remote) !== JSON.stringify(local.get(file))) throw new Error(`${file}: semantic mismatch`);
                }));
              }

              const index = await fetchJson(`${origin}/data/series/index.json?verify=axelar-secret-keys-${attempt}-${Date.now()}`);
              const keys = index.records.map((record) => record.global_record_key);
              if (keys.length !== 83 || new Set(keys).size !== 83) throw new Error('global-key uniqueness/count mismatch');

              console.log(`BIR Series production equality PASS attempt=${attempt} files=${files.length} records=${keys.length}`);
              lastError = null;
              break;
            } catch (error) {
              lastError = error;
              console.log(`Attempt ${attempt}/30 failed: ${error.message}`);
              await sleep(10000);
            }
          }
          if (lastError) throw lastError;
          NODE

      - name: Verify Axelar-Secret and representative human routes
        run: |
          set -euo pipefail
          for url in \
            https://bir.badjoke-lab.com/bridge/axelar-secret-ibc-bridge/ \
            https://bir.badjoke-lab.com/incident/axelar-secret-ibc-bridge-2026-source-channel-validation-exploit/ \
            https://bir.badjoke-lab.com/incidents/ \
            https://bir.badjoke-lab.com/compare/ \
            https://bir.badjoke-lab.com/stats/; do
            code="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "${url}?verify=axelar-secret-$(date +%s)")"
            test "$code" -ge 200 && test "$code" -lt 400
            echo "$url -> $code"
          done
