name: TEMP Batch 11 Mantle Mainnet Bridge Applicator
on:
  push:
    branches:
      - canonical/growth-batch-11-mantle-mainnet-bridge
    paths:
      - scripts/apply-batch-11-mantle-mainnet-bridge.mjs
      - .github/workflows/temp-batch-11-mantle-mainnet-bridge.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-11-mantle-mainnet-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-batch-11-mantle-mainnet-bridge.mjs
