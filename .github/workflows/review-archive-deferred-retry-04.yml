name: Review Archive Deferred Retry 04

on:
  push:
    branches:
      - agent/phase3-archive-deferred-retry-04-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare bounded reviewer
        run: |
          git show 7bd452ee8a86073355266cd0bbeec4bada8eb1b9:scripts/review-archive-capture-batch14.mjs \
            | sed -e 's/archive-capture-batch14/archive-deferred-retry-04/g' -e 's/Archive Capture Batch 14/Archive Deferred Retry 04/g' \
            > /tmp/review-archive-deferred-retry-04.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='/tmp/review-archive-deferred-retry-04.mjs';
          let source=fs.readFileSync(file,'utf8');
          const start=source.indexOf('function buildCandidates() {');
          const end=source.indexOf('\nfunction timestampDate',start);
          if(start<0||end<0) throw new Error('buildCandidates boundary not found');
          const targetIds=['bir_src_000277','bir_src_000282'];
          const replacement=[
            'function buildCandidates() {',
            `  const targetIds = ${JSON.stringify(targetIds)};`,
            '  const selected = [];',
            '  const seen = new Set();',
            '  for (const targetId of targetIds) {',
            '    const target = evidence.find((item) => item.id === targetId);',
            '    if (!target) throw new Error("Deferred retry target ID missing: " + targetId);',
            '    if (hasArchive(target)) throw new Error("Deferred retry target already archived: " + targetId);',
            '    const key = canonicalUrlKey(target.url);',
            '    if (seen.has(key)) throw new Error("Deferred retry target IDs collide on one URL: " + targetId);',
            '    seen.add(key);',
            '    const records = evidence.filter((item) => !hasArchive(item)).filter((item) => {',
            '      try { return canonicalUrlKey(item.url) === key; } catch { return false; }',
            '    }).sort((a, b) => a.id.localeCompare(b.id));',
            '    const publishedAt = records.map((item) => item.published_at).filter(Boolean).sort().at(-1);',
            '    if (!publishedAt) throw new Error("Deferred retry target missing published_at: " + targetId);',
            '    const terminal = records.some((item) => terminalStatuses.has(bridgesById.get(item.bridge_id)?.status));',
            '    const risky = records.some((item) => isRiskyHost(hostOf(item.url)));',
            '    selected.push({label:records[0].title,url:records[0].url,published_at:publishedAt,evidence_ids:records.map((item)=>item.id),bridge_ids:[...new Set(records.map((item)=>item.bridge_id))],queue:terminal&&risky?"terminal+risky":terminal?"terminal":risky?"risky":"reviewed",terminal,risky});',
            '  }',
            '  return { reviewed_ids: reviewedEvidenceIds().size, eligible_unique_urls: targetIds.length, selected };',
            '}',
            ''
          ].join('\n');
          source=source.slice(0,start)+replacement+source.slice(end);
          fs.writeFileSync(file,source);
          NODE

      - name: First replay pass
        run: |
          node /tmp/review-archive-deferred-retry-04.mjs
          mv artifacts/archive-deferred-retry-04-review.json artifacts/archive-deferred-retry-04-review-run1.json
          mv artifacts/archive-deferred-retry-04-review.md artifacts/archive-deferred-retry-04-review-run1.md

      - name: Second replay pass
        run: |
          sleep 5
          node /tmp/review-archive-deferred-retry-04.mjs
          mv artifacts/archive-deferred-retry-04-review.json artifacts/archive-deferred-retry-04-review-run2.json
          mv artifacts/archive-deferred-retry-04-review.md artifacts/archive-deferred-retry-04-review-run2.md

      - name: Reconcile reproducible approvals
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('artifacts/archive-deferred-retry-04-review-run1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('artifacts/archive-deferred-retry-04-review-run2.json','utf8'));
          const scopeA=a.results.map(x=>JSON.stringify([x.url,x.evidence_ids]));
          const scopeB=b.results.map(x=>JSON.stringify([x.url,x.evidence_ids]));
          if(JSON.stringify(scopeA)!==JSON.stringify(scopeB)) throw new Error('scope changed');
          const mapB=new Map(b.results.map(x=>[x.url,x]));
          const results=a.results.map(first=>{
            const second=mapB.get(first.url);
            const same=Boolean(first.approved&&second?.approved&&first.approved.archive_url===second.approved.archive_url&&first.approved.status===200&&second.approved.status===200&&first.approved.bytes>=65536&&second.approved.bytes>=65536);
            return {label:first.label,queue:first.queue,url:first.url,published_at:first.published_at,evidence_ids:first.evidence_ids,bridge_ids:first.bridge_ids,run1:{decision:first.decision,approved:first.approved,captures_discovered:first.captures_discovered,temporally_eligible_captures:first.temporally_eligible_captures,discovery_errors:first.discovery_errors},run2:{decision:second.decision,approved:second.approved,captures_discovered:second.captures_discovered,temporally_eligible_captures:second.temporally_eligible_captures,discovery_errors:second.discovery_errors},reproducible_approved:same?first.approved:null,decision:same?'approved_reproducible_exact_replay':'deferred_not_reproducible_or_unavailable'};
          });
          const report={generated_at:new Date().toISOString(),source_runs:[a.generated_at,b.generated_at],selected_unique_urls:results.length,reproducible_approved_unique_urls:results.filter(x=>x.reproducible_approved).length,reproducible_approved_evidence_records:results.filter(x=>x.reproducible_approved).reduce((sum,x)=>sum+x.evidence_ids.length,0),results};
          fs.writeFileSync('artifacts/archive-deferred-retry-04-reconciled.json',JSON.stringify(report,null,2)+'\n');
          console.log('RETRY04_START'); console.log(JSON.stringify(report,null,2)); console.log('RETRY04_END');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: archive-deferred-retry-04
          path: |
            artifacts/archive-deferred-retry-04-review-run1.json
            artifacts/archive-deferred-retry-04-review-run1.md
            artifacts/archive-deferred-retry-04-review-run2.json
            artifacts/archive-deferred-retry-04-review-run2.md
            artifacts/archive-deferred-retry-04-reconciled.json
          if-no-files-found: error
