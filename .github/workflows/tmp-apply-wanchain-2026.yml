name: Temporary Apply Wanchain 2026 Canonical Draft

on:
  push:
    branches:
      - canonical/wanchain-cardano-2026
    paths:
      - scripts/tmp-apply-wanchain-2026.mjs
      - .github/workflows/tmp-apply-wanchain-2026.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v6
        with:
          ref: canonical/wanchain-cardano-2026
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded canonical draft
        run: node scripts/tmp-apply-wanchain-2026.mjs

      - name: Validate generated canonical data
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality

      - name: Commit generated canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json data/reference/chains.json data/reference/assets.json
          git diff --cached --exit-code && { echo 'Expected canonical diff was not generated.' >&2; exit 1; } || true
          git commit -m 'data: add Wanchain Cardano 2026 incident draft'
          git push origin HEAD:canonical/wanchain-cardano-2026
