name: Apply Allbridge Core 2026 Canonical Records

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/apply-allbridge-core-2026-exploit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v7
        with:
          ref: agent/apply-allbridge-core-2026-exploit
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply approved bounded migration
        run: node scripts/apply-allbridge-core-2026.mjs

      - name: Assert canonical-only working-tree mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual-files
          printf '%s\n' \
            data/bridges.json \
            data/evidence.json \
            data/events.json \
            data/incidents.json | sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate approved canonical migration
        run: |
          npm audit --audit-level=high
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run monitoring:test
          npm run production:content:test
          npm run performance:test
          npm run build
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
          npm run dist:test

      - name: Commit canonical migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "data: add Allbridge Core 2026 incident [canonical]"
          git push origin HEAD:agent/apply-allbridge-core-2026-exploit
