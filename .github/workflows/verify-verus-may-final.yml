name: Verify Verus May final canonical tree

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-verus-may-final.yml'
      - 'data/**'
      - 'README.md'
      - 'docs/runbooks/**'

permissions:
  contents: read

concurrency:
  group: verify-verus-may-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-final-tree:
    if: github.head_ref == 'canonical/verus-may-2026'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: canonical/verus-may-2026
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data and enums
        run: |
          npm run validate:data
          npm run validate:enums

      - name: Run corpus and source gates
        run: |
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test

      - name: Run monitoring and content tests
        run: |
          npm run monitoring:test
          npm run production:content:test
          npm run performance:test

      - name: Build native and Series output
        run: npm run build

      - name: Validate SEO output
        run: node scripts/check-seo.mjs

      - name: Validate accessibility performance and dist
        run: |
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
          npm run dist:test

      - name: Assert canonical files unchanged by validation
        run: git diff --exit-code -- data/bridges.json data/incidents.json data/events.json data/evidence.json

      - name: Prepare pinned Playwright runtime
        timeout-minutes: 10
        run: |
          npm install --no-save --ignore-scripts playwright@1.60.0
          docker pull mcr.microsoft.com/playwright:v1.60.0-noble

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/bir-verus-may-final.log 2>&1 &
          echo $! > /tmp/bir-verus-may-final.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bir-verus-may-final.log
          exit 1

      - name: Run Chromium Firefox WebKit compatibility smoke
        run: |
          docker run --rm --ipc=host --network host \
            -v "$PWD:/work" \
            -w /work \
            -e BIR_COMPAT_BASE_URL=http://127.0.0.1:4173 \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            node scripts/check-browser-compatibility.mjs

      - name: Stop static server
        if: always()
        run: |
          if test -f /tmp/bir-verus-may-final.pid; then
            kill "$(cat /tmp/bir-verus-may-final.pid)" || true
          fi
