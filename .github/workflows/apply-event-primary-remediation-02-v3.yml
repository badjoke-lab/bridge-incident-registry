name: Apply Event Primary Remediation 02 v3

on:
  push:
    branches:
      - agent/phase3-event-primary-remediation-02-v3

permissions:
  contents: write

concurrency:
  group: apply-event-primary-remediation-02-v3
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout bounded branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-event-primary-remediation-02-v3
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact reviewed remediation and count-contract sync
        run: node scripts/apply-event-primary-remediation-02-v3.mjs

      - name: Install dependencies without lockfile side effects
        run: npm install --no-package-lock

      - name: Run complete repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Assert exact canonical result
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence = JSON.parse(fs.readFileSync('data/evidence.json', 'utf8'));
          const events = JSON.parse(fs.readFileSync('data/events.json', 'utf8'));
          const incidents = JSON.parse(fs.readFileSync('data/incidents.json', 'utf8'));
          const bridges = JSON.parse(fs.readFileSync('data/bridges.json', 'utf8'));
          const byId = (items, id) => items.find((item) => item.id === id);
          if (evidence.length !== 287) throw new Error(`evidence length ${evidence.length}`);
          const copies = [
            ['bir_src_000285','bir_src_000270','bir_ev_000013'],
            ['bir_src_000286','bir_src_000279','bir_ev_000124'],
            ['bir_src_000287','bir_src_000279','bir_ev_000125']
          ];
          for (const [copyId, sourceId, eventId] of copies) {
            const copy = byId(evidence, copyId);
            const source = byId(evidence, sourceId);
            if (!copy || !source) throw new Error(`missing ${copyId}/${sourceId}`);
            if (copy.event_id !== eventId || copy.url !== source.url || copy.archived_url !== source.archived_url || copy.is_primary !== true || copy.source_tier !== 'tier_1' || copy.claim_scope !== 'incident_case') {
              throw new Error(`copy boundary ${copyId}`);
            }
          }
          if (byId(events,'bir_ev_000013').source_count !== 3) throw new Error('bir_ev_000013 count');
          if (byId(events,'bir_ev_000124').source_count !== 3) throw new Error('bir_ev_000124 count');
          if (byId(events,'bir_ev_000125').source_count !== 3) throw new Error('bir_ev_000125 count');
          if (byId(incidents,'bir_inc_000005').source_count !== 10) throw new Error('bir_inc_000005 count');
          if (byId(incidents,'bir_inc_000028').source_count !== 14) throw new Error('bir_inc_000028 count');

          const evidenceByEvent = new Map(events.map((item) => [item.id, []]));
          for (const source of evidence) if (source.event_id) evidenceByEvent.get(source.event_id)?.push(source);
          const primaryGaps = events.filter((event) => !(evidenceByEvent.get(event.id) ?? []).some((source) => source.is_primary === true));
          const tier1Gaps = events.filter((event) => !(evidenceByEvent.get(event.id) ?? []).some((source) => source.source_tier === 'tier_1'));
          if (primaryGaps.length !== 11) throw new Error(`primary gaps ${primaryGaps.length}`);
          if (tier1Gaps.length !== 6) throw new Error(`tier1 gaps ${tier1Gaps.length}`);
          if (evidence.filter((source) => source.is_primary === true).length !== 206) throw new Error('primary evidence count');
          if (evidence.filter((source) => source.source_tier === 'tier_1').length !== 223) throw new Error('tier1 evidence count');
          if (evidence.filter((source) => typeof source.archived_url === 'string' && source.archived_url.trim()).length !== 130) throw new Error('archive record count');

          const bridgeById = new Map(bridges.map((item) => [item.id, item]));
          const terminal = new Set(['dead','deprecated','migrated']);
          const riskyHosts = ['x.com','twitter.com','medium.com','mirror.xyz','substack.com','docs.google.com','notion.site'];
          const hostOf = (raw) => { try { return new URL(raw).hostname.replace(/^www\./,'').toLowerCase(); } catch { return 'invalid'; } };
          const isRisky = (host) => riskyHosts.some((base) => host === base || host.endsWith(`.${base}`));
          const hasArchive = (source) => typeof source.archived_url === 'string' && source.archived_url.trim().length > 0;
          const norm = (url) => { try { return new URL(url).toString(); } catch { return url; } };
          const terminalUrls = new Set(evidence.filter((source) => terminal.has(bridgeById.get(source.bridge_id)?.status) && !hasArchive(source)).map((source) => norm(source.url)));
          const riskyUrls = new Set(evidence.filter((source) => isRisky(hostOf(source.url)) && !hasArchive(source)).map((source) => norm(source.url)));
          if (terminalUrls.size !== 15 || riskyUrls.size !== 16) throw new Error(`archive risk ${terminalUrls.size}/${riskyUrls.size}`);
          if (evidence.some((source) => source.url_status === 'unknown')) throw new Error('unknown URL status');

          const baseline = fs.readFileSync('scripts/check-source-quality-baseline.mjs', 'utf8');
          if (!baseline.includes('  events_without_primary: 11,')) throw new Error('baseline not 11');
          console.log(JSON.stringify({evidence:287,primary:206,tier1:223,archived_records:130,primary_gaps:11,tier1_gaps:6,terminal_unique:15,risky_unique:16}, null, 2));
          NODE

      - name: Remove one-shot applicator
        run: |
          rm .github/workflows/apply-event-primary-remediation-02-v3.yml
          rm scripts/apply-event-primary-remediation-02-v3.mjs

      - name: Assert exact permanent scope
        run: |
          git fetch origin main
          actual="$({ git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            README.md \
            data/evidence.json \
            data/events.json \
            data/incidents.json \
            docs/audits/phase3-event-primary-remediation-02-canonical-2026-08-09.md \
            docs/runbooks/current-status.md \
            docs/runbooks/development-roadmap.md \
            docs/runbooks/public-consistency-remediation.md \
            docs/runbooks/recovery-checkpoint.md \
            scripts/check-source-quality-baseline.mjs | sort)"
          printf 'Permanent diff:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push permanent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: remediate event primary evidence 02"
          git push origin HEAD:agent/phase3-event-primary-remediation-02-v3
