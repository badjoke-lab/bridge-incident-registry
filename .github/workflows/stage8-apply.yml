name: BIR Stage 8 bounded canonical applicator

on:
  push:
    branches:
      - agent/stage8-bounded-canonical
    paths:
      - .github/workflows/stage8-apply.yml
      - scripts/apply-stage8-bounded-followup.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage8-bounded-canonical
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply reviewed bounded Stage 8 delta
        run: node scripts/apply-stage8-bounded-followup.mjs

      - name: Commit canonical delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json data/events.json data/evidence.json
          git diff --cached --exit-code && { echo "Expected canonical delta was not produced"; exit 1; }
          git commit -m "Apply bounded BIR Stage 8 canonical follow-up"
          git push origin HEAD:agent/stage8-bounded-canonical
