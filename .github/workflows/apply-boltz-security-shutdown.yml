name: Apply Boltz security shutdown

on:
  push:
    branches:
      - agent/record-boltz-security-shutdown-2026-08-04
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/record-boltz-security-shutdown-2026-08-04')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/record-boltz-security-shutdown-2026-08-04
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Remove unverified wildcard archive placeholders
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'scripts/apply-boltz-security-shutdown.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replaceAll('archived_url: "https://web.archive.org/web/*/https://boltz.exchange/"', 'archived_url: null');
          source = source.replaceAll('archived_url: "https://web.archive.org/web/*/https://api.docs.boltz.exchange/claiming-swaps.html"', 'archived_url: null');
          fs.writeFileSync(path, source);
          NODE

      - name: Apply canonical records
        run: node scripts/apply-boltz-security-shutdown.mjs

      - name: Validate canonical data
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:source-count
          npm run audit:source-quality
          npm run check
          npm run build

      - name: Remove temporary applicator
        run: |
          rm scripts/apply-boltz-security-shutdown.mjs
          rm .github/workflows/apply-boltz-security-shutdown.yml

      - name: Commit canonical result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json scripts/check-source-quality-baseline.mjs
          git add -u scripts/apply-boltz-security-shutdown.mjs .github/workflows/apply-boltz-security-shutdown.yml
          git commit -m "Record Boltz security-driven bridge pause"
          git push origin HEAD:agent/record-boltz-security-shutdown-2026-08-04
