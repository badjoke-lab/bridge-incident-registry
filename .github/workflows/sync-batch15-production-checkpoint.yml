name: Sync Batch 15 Production Checkpoint

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch15-production-checkpoint
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-batch15-production-checkpoint
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout checkpoint branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-archive-capture-batch15-production-checkpoint
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without retaining generated lockfile
        run: |
          npm install
          rm -f package-lock.json

      - name: Synchronize permanent checkpoint
        run: node scripts/sync-batch15-production-checkpoint.mjs

      - name: Assert bounded documentation diff
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            README.md \
            docs/audits/production-verification-phase3-archive-capture-batch15-2026-08-05.md \
            docs/operations/current-position.md \
            docs/operations/current-schedule.md \
            docs/runbooks/current-status.md \
            docs/runbooks/development-roadmap.md \
            docs/runbooks/recovery-checkpoint.md | sort)"
          printf 'Observed documentation diff:\n%s\n' "$changed"
          test "$changed" = "$expected"

      - name: Run complete repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test

      - name: Remove temporary checkpoint tools
        run: |
          rm scripts/sync-batch15-production-checkpoint.mjs
          rm .github/workflows/sync-batch15-production-checkpoint.yml

      - name: Commit permanent checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            docs/audits/production-verification-phase3-archive-capture-batch15-2026-08-05.md \
            docs/operations/current-position.md \
            docs/operations/current-schedule.md \
            docs/runbooks/current-status.md \
            docs/runbooks/development-roadmap.md \
            docs/runbooks/recovery-checkpoint.md
          git add -u scripts/sync-batch15-production-checkpoint.mjs .github/workflows/sync-batch15-production-checkpoint.yml
          git commit -m "verification: complete Batch 15 production checkpoint"
          git push origin HEAD:agent/phase3-archive-capture-batch15-production-checkpoint
