name: Temporary Apply Growth Batch 01

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-growth-batch-01.mjs'
      - '.github/workflows/apply-growth-batch-01.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'canonical/growth-batch-01-poly-multichain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Apply bounded canonical delta
        run: node scripts/apply-growth-batch-01.mjs
      - name: Sync bridge aggregate flags
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'data/bridges.json';
          const bridges = JSON.parse(fs.readFileSync(p, 'utf8'));
          const multi = bridges.find((x) => x.id === 'bir_bridge_000007');
          if (!multi) throw new Error('Multichain bridge not found');
          multi.has_reimbursement_history = true;
          fs.writeFileSync(p, JSON.stringify(bridges, null, 2) + '\n');
          NODE
      - name: Promote reviewed primary evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'data/evidence.json';
          const evidence = JSON.parse(fs.readFileSync(p, 'utf8'));
          const byId = (id) => {
            const x = evidence.find((r) => r.id === id);
            if (!x) throw new Error(`evidence not found: ${id}`);
            return x;
          };

          const polyPause = byId('bir_src_000351');
          Object.assign(polyPause, {
            source_type: 'other',
            title: 'Post Mortem — PolyNetwork’s Exploit',
            url: 'https://www.metis.io/blog/post-mortem-polynetworks-exploit',
            publisher: 'Metis',
            published_at: '2023-07-03',
            published_at_precision: 'day',
            reliability: 'high',
            source_tier: 'tier_1',
            url_status: 'live',
            claim_scope: 'incident_case',
            language: 'en',
            author: null,
            is_primary: true,
            is_official_domain: true,
            supports_amount: false,
            supports_recovery: false,
            supports_reimbursement: false,
            supports_reopen: false,
            supports_shutdown: true,
            supports_migration: false,
            notes: 'First-party affected-ecosystem postmortem supporting containment and bridge closure during the PolyNetwork exploit.'
          });

          const multichainUrl = 'https://medium.com/multichainorg/multichain-contract-vulnerability-post-mortem-d37bfab237c8';
          const multichainArchive = 'https://web.archive.org/web/*/https://medium.com/multichainorg/multichain-contract-vulnerability-post-mortem-d37bfab237c8';
          const multiExploit = byId('bir_src_000352');
          Object.assign(multiExploit, {
            source_type: 'other',
            title: 'Multichain Contract Vulnerability Post Mortem',
            url: multichainUrl,
            archived_url: multichainArchive,
            publisher: 'Multichain',
            published_at: '2022-02-19',
            published_at_precision: 'day',
            reliability: 'high',
            source_tier: 'tier_1',
            url_status: 'live',
            claim_scope: 'root_cause',
            language: 'en',
            author: 'Multichain (Previously Anyswap)',
            is_primary: true,
            is_official_domain: false,
            supports_amount: true,
            supports_recovery: true,
            supports_reimbursement: true,
            supports_reopen: true,
            supports_shutdown: true,
            supports_migration: true,
            notes: 'Official Multichain postmortem covering the router/liquidity-pool vulnerabilities, exploitation, mitigation timeline, rescued funds and compensation plan.'
          });
          const multiRecovery = byId('bir_src_000353');
          Object.assign(multiRecovery, {
            source_type: 'other',
            title: 'Multichain Contract Vulnerability Post Mortem',
            url: multichainUrl,
            archived_url: multichainArchive,
            publisher: 'Multichain',
            published_at: '2022-02-19',
            published_at_precision: 'day',
            reliability: 'high',
            source_tier: 'tier_1',
            url_status: 'live',
            claim_scope: 'recovery',
            language: 'en',
            author: 'Multichain (Previously Anyswap)',
            is_primary: true,
            is_official_domain: false,
            supports_amount: true,
            supports_recovery: true,
            supports_reimbursement: true,
            supports_reopen: true,
            supports_shutdown: true,
            supports_migration: true,
            notes: 'Official Multichain postmortem documenting whitehat rescue, returned funds, V6 migration and the proposed 100% reimbursement boundary.'
          });

          fs.writeFileSync(p, JSON.stringify(evidence, null, 2) + '\n');
          NODE
      - name: Sync count-bearing documentation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = [
            'README.md',
            'docs/runbooks/current-status.md',
            'docs/runbooks/recovery-checkpoint.md',
            'docs/runbooks/development-roadmap.md',
            'docs/runbooks/public-consistency-remediation.md'
          ];
          const counts = { Bridges: 42, Incidents: 47, Events: 214, Evidence: 352 };
          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8');
            for (const [label, count] of Object.entries(counts)) {
              const re = new RegExp(`\\b${label}\\s+\\d+\\b`, 'g');
              text = text.replace(re, `${label}   ${count}`);
            }
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Validate canonical data
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run check
          npm run production:content:test
          npm run performance:test
          npm run build
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
          npm run dist:test
      - name: Assert target counts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c = (p) => JSON.parse(fs.readFileSync(p,'utf8')).length;
          const got = [c('data/bridges.json'),c('data/incidents.json'),c('data/events.json'),c('data/evidence.json')];
          const want = [42,47,214,352];
          if (got.some((v,i)=>v!==want[i])) throw new Error(`count mismatch ${got.join('/')}`);
          console.log(`Batch 01 counts OK: ${got.join('/')}`);
          NODE
      - name: Remove temporary applicator
        run: rm scripts/apply-growth-batch-01.mjs .github/workflows/apply-growth-batch-01.yml
      - name: Commit validated canonical tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No canonical delta to commit'
            exit 1
          fi
          git commit -m 'Add record-growth Batch 01 incidents'
          git push origin HEAD:${{ github.head_ref }}
