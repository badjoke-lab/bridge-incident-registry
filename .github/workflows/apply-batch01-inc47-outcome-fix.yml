name: Temporary Apply Batch01 Incident 47 Outcome Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix-batch01-inc47-outcome.mjs'
      - '.github/workflows/apply-batch01-inc47-outcome-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/batch01-inc47-outcome'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Apply bounded repair
        run: node scripts/fix-batch01-inc47-outcome.mjs
      - name: Validate repaired corpus
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run check
          npm run build
          npm run dist:check
          npm run dist:test
      - name: Remove temporary repair tooling
        run: rm scripts/fix-batch01-inc47-outcome.mjs .github/workflows/apply-batch01-inc47-outcome-fix.yml
      - name: Commit validated repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Multichain 2022 unresolved outcome consistency'
          git push origin HEAD:${{ github.head_ref }}
