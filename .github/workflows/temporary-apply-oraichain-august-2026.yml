name: Temporary Apply Oraichain August 2026

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'canonical/oraichain-august-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/oraichain-august-2026
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply bounded Oraichain package
        run: |
          node scripts/apply-oraichain-august-2026.mjs
          node scripts/fix-oraichain-source-count.mjs
      - name: Assert bounded canonical state
        run: |
          node - <<'NODE'
          const fs=require('fs'),r=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const b=r('data/bridges.json'),i=r('data/incidents.json'),e=r('data/events.json'),s=r('data/evidence.json'),c=r('data/reference/chains.json'),a=r('data/reference/assets.json');
          if(b.length!==42||i.length!==45||e.length!==210||s.length!==347) throw new Error(`counts ${b.length}/${i.length}/${e.length}/${s.length}`);
          const br=b.find(x=>x.id==='bir_bridge_000042'),inc=i.find(x=>x.id==='bir_inc_000045');
          if(!br||br.status!=='limited'||br.canonical_name!=='Oraichain EVM cross-chain transfer path') throw new Error('bridge boundary');
          if(!inc||inc.source_count!==5||inc.attack_vector_category!=='message_verification_failure'||inc.reported_loss_usd!==null) throw new Error('incident boundary');
          if(inc.recovery_status!=='unknown'||inc.reimbursement_status!=='unknown'||inc.restart_status!=='partially_reopened') throw new Error('aftermath boundary');
          if(!c.oraichain||!a.orai) throw new Error('reference normalization missing');
          NODE
      - name: Sync documentation counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[Path('README.md'),Path('docs/runbooks/current-status.md'),Path('docs/runbooks/development-roadmap.md'),Path('docs/runbooks/public-consistency-remediation.md')]
          for p in paths:
              t=p.read_text()
              for old,new in [('Bridges     41','Bridges     42'),('Incidents   44','Incidents   45'),('Events      206','Events      210'),('Evidence    342','Evidence    347')]:
                  if old in t: t=t.replace(old,new,1)
              p.write_text(t)
          p=Path('docs/runbooks/recovery-checkpoint.md'); t=p.read_text()
          for old,new in [('Bridges                  41','Bridges                  42'),('Incidents                44','Incidents                45'),('Events                   206','Events                   210'),('Evidence                 342','Evidence                 347')]:
              if old in t: t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Install dependencies
        run: npm install
      - name: Validate canonical data
        run: |
          npm audit --audit-level=high
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run monitoring:test
          npm run production:content:test
          npm run performance:test
          npm run build
          npm run accessibility:check
          npm run performance:check
          npm run dist:check
          npm run dist:test
      - name: Remove temporary artifacts
        run: |
          rm -f package-lock.json
          rm scripts/apply-oraichain-august-2026.mjs
          rm scripts/fix-oraichain-source-count.mjs
          rm .github/workflows/temporary-apply-oraichain-august-2026.yml
      - name: Commit final bounded tree
        run: |
          git config user.name 'badjoke-lab'
          git config user.email 'badjoke.lab@gmail.com'
          git add -A
          git commit -m 'Apply Oraichain August 2026 canonical incident'
          git push origin HEAD:canonical/oraichain-august-2026
