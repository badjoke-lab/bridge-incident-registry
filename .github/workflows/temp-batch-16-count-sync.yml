name: TEMP Batch 16 count sync

on:
  push:
    branches:
      - canonical/growth-batch-16-shyft-bridge

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync current canonical count blocks
        shell: bash
        run: |
          npm ci
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'README.md',
            'docs/runbooks/current-status.md',
            'docs/runbooks/recovery-checkpoint.md',
            'docs/runbooks/development-roadmap.md',
            'docs/runbooks/public-consistency-remediation.md'
          ];
          const oldBlock = 'Bridges   68\nIncidents   51\nEvents   242\nEvidence   397';
          const newBlock = 'Bridges   69\nIncidents   51\nEvents   243\nEvidence   398';
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            const hits = text.split(oldBlock).length - 1;
            if (hits !== 1) throw new Error(`${file}: expected exactly one current-count block, found ${hits}`);
            fs.writeFileSync(file, text.replace(oldBlock,newBlock));
          }
          NODE
          npm run build
          npm run dist:check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git commit -m 'docs: sync Batch 16 canonical counts'
          git rm .github/workflows/temp-batch-16-count-sync.yml
          git commit -m 'chore: remove temporary Batch 16 count sync'
          git push
