name: Apply Archive Batch 10

on:
  pull_request:
    paths:
      - ".github/workflows/archive-batch10-apply.yml"
      - "scripts/apply-archive-batch10.mjs"
      - "data/evidence.json"
      - "scripts/check-source-quality-baseline.mjs"
      - "docs/audits/phase3-archive-capture-batch10-2026-08-03.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-batch10-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-archive-batch10:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/phase3-archive-capture-batch10-canonical'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply reviewed mappings
        run: node scripts/apply-archive-batch10.mjs

      - name: Commit canonical result
        run: |
          if git diff --quiet -- data/evidence.json scripts/check-source-quality-baseline.mjs docs/audits/phase3-archive-capture-batch10-2026-08-03.md; then
            echo "Canonical Batch 10 result already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence.json scripts/check-source-quality-baseline.mjs docs/audits/phase3-archive-capture-batch10-2026-08-03.md
          git commit -m "data: apply reviewed archive capture Batch 10"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
