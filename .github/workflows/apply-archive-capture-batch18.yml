name: Apply Archive Capture Batch 18

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch18-canonical
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-archive-capture-batch18
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-archive-capture-batch18-canonical
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without lockfile mutation
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Apply reviewed Batch 18 mappings
        run: node scripts/apply-archive-capture-batch18.mjs
      - name: Assert bounded canonical working diff
        run: |
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            data/evidence.json \
            docs/audits/phase3-archive-capture-batch18-2026-08-09.md \
            scripts/check-source-quality-baseline.mjs | sort)"
          printf 'Observed files:\n%s\n' "$changed"
          printf 'Expected files:\n%s\n' "$expected"
          test "$changed" = "$expected"
      - name: Run complete repository checks
        run: |
          npm run check
          npm run validate:data
          npm run validate:enums
          npm run audit:first-ten
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run audit:full-corpus:test
          npm run audit:source-count:test
          npm run audit:source-quality:test
          npm run production:content:test
          npm run build
          npm run dist:check
          npm run dist:test
      - name: Remove temporary canonical tools
        run: |
          rm scripts/apply-archive-capture-batch18.mjs
          rm .github/workflows/apply-archive-capture-batch18.yml
      - name: Assert final permanent paths
        run: |
          changed="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            .github/workflows/apply-archive-capture-batch18.yml \
            data/evidence.json \
            docs/audits/phase3-archive-capture-batch18-2026-08-09.md \
            scripts/apply-archive-capture-batch18.mjs \
            scripts/check-source-quality-baseline.mjs | sort)"
          printf 'Observed final files:\n%s\n' "$changed"
          printf 'Expected final files:\n%s\n' "$expected"
          test "$changed" = "$expected"
      - name: Commit permanent canonical change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence.json scripts/check-source-quality-baseline.mjs docs/audits/phase3-archive-capture-batch18-2026-08-09.md
          git add -u scripts/apply-archive-capture-batch18.mjs .github/workflows/apply-archive-capture-batch18.yml
          git commit -m "data: add verified archive capture Batch 18"
          git push origin HEAD:agent/phase3-archive-capture-batch18-canonical
