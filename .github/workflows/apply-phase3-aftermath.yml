name: Apply Phase 3 Aftermath Enrichment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: phase3-aftermath-source-enrichment
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect applied enrichment
        id: applied
        run: |
          if jq -e '.[] | select(.id == "bir_src_000070")' data/evidence.json >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply enrichment
        if: steps.applied.outputs.exists == 'false'
        run: |
          node scripts/phase3/enrich-wormhole.mjs
          node scripts/phase3/enrich-nomad.mjs
          node scripts/phase3/enrich-harmony.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate canonical data
        run: npm run validate:data

      - name: Run first-ten audit
        run: npm run audit:first-ten

      - name: Type and Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Commit enriched records
        if: steps.applied.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "data: enrich first-ten aftermath and primary sources"
          git push origin HEAD:phase3-aftermath-source-enrichment
