name: Sync Sandbox tranche counts
on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-07-sandbox-2026
    paths:
      - scripts/sync-sandbox-counts.mjs
      - .github/workflows/sync-sandbox-counts.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-21-tranche-07-sandbox-2026
      - run: node scripts/sync-sandbox-counts.mjs
      - name: Commit synchronized counts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git diff --cached --quiet && exit 0
          git commit -m "Sync Sandbox tranche canonical document counts"
          git push origin HEAD:canonical/growth-batch-21-tranche-07-sandbox-2026
