name: Phase 3 Archive Capture Batch 12 Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-archive-capture-batch12.mjs
      - .github/workflows/phase3-archive-capture-batch12-apply.yml
      - data/evidence.json
      - scripts/check-source-quality-baseline.mjs

permissions:
  contents: write

concurrency:
  group: phase3-archive-capture-batch12-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply reviewed archive mappings
        run: node scripts/apply-archive-capture-batch12.mjs

      - name: Validate canonical state
        run: |
          npm install
          npm run validate:data
          npm run audit:source-quality

      - name: Commit canonical result
        run: |
          if git diff --quiet -- data/evidence.json scripts/check-source-quality-baseline.mjs; then
            echo "Canonical mappings already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evidence.json scripts/check-source-quality-baseline.mjs
          git commit -m "Apply verified archive capture Batch 12"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
