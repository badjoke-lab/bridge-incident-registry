name: Source Count Review Batch 1

on:
  push:
    branches:
      - agent/phase3-source-count-review-batch1

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-source-count-review-batch1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate review inventory
        run: node scripts/report-source-count-review-batch1.mjs

      - name: Commit review inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.source-count-review-batch1.md
          if git diff --cached --quiet; then
            echo "Expected review inventory was not generated."
            exit 1
          fi
          git commit -m "docs: capture source-count review batch1 inventory [inventory]"
          git push origin HEAD:agent/phase3-source-count-review-batch1
