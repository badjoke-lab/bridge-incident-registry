name: Event Tier 1 Review Batch 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ github.actor != 'github-actions[bot]' && github.head_ref == 'agent/phase3-event-tier1-review-batch1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-event-tier1-review-batch1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate event Tier 1 inventory
        run: node scripts/report-event-tier1-review-batch1.mjs

      - name: Commit generated inventory
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.event-tier1-review-batch1.md
          git commit -m "audit: capture event Tier 1 review Batch 1 [inventory]"
          git push origin HEAD:agent/phase3-event-tier1-review-batch1
