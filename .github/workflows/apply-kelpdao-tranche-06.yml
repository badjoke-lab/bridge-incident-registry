name: Apply KelpDAO tranche 06
on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-06-kelpdao-2026
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-21-tranche-06-kelpdao-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci
      - run: node scripts/apply-kelpdao-tranche-06.mjs
      - name: Attach primary evidence to pause event
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('data/evidence.json','utf8'));
          const incidents=JSON.parse(fs.readFileSync('data/incidents.json','utf8'));
          const events=JSON.parse(fs.readFileSync('data/events.json','utf8'));
          evidence.push({id:'bir_src_000428',bridge_id:'bir_bridge_000080',incident_id:'bir_inc_000060',event_id:'bir_ev_000265',source_type:'official_blog',title:'KelpDAO Incident Statement',url:'https://layerzero.network/blog/kelpdao-incident-statement',publisher:'LayerZero Labs',published_at:'2026-04-19',published_at_precision:'day',reliability:'high',source_tier:'tier_1',url_status:'live',accessed_at:'2026-09-09',claim_scope:'event',language:'en',author:null,quote_excerpt:null,is_primary:true,is_paywalled:false,is_official_domain:true,supports_amount:false,supports_recovery:false,supports_reimbursement:false,supports_reopen:false,supports_shutdown:true,supports_migration:false,notes:'First-party statement from the compromised DVN infrastructure operator supporting KelpDAO acknowledgement and the pause of rsETH contracts during containment.'});
          incidents.find(x=>x.id==='bir_inc_000060').source_count=4;
          events.find(x=>x.id==='bir_ev_000265').source_count=2;
          fs.writeFileSync('data/evidence.json',JSON.stringify(evidence,null,2)+'\n');
          fs.writeFileSync('data/incidents.json',JSON.stringify(incidents,null,2)+'\n');
          fs.writeFileSync('data/events.json',JSON.stringify(events,null,2)+'\n');
          NODE
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "Add KelpDAO rsETH Bridge 2026 canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-06-kelpdao-2026
