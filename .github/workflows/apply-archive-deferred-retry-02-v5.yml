name: Apply Archive Deferred Retry 02 v5

on:
  push:
    branches:
      - agent/phase3-archive-deferred-retry-02-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact canonical patch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const target='bir_src_000166';
          const archive='https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417';
          let text=fs.readFileSync('data/evidence.json','utf8');
          let hits=0;
          text=text.split('\n').map(line=>{
            if(!line.includes(`"id":"${target}"`)) return line;
            hits++;
            if(!line.includes('"archived_url":null')) throw new Error('Unexpected target boundary');
            return line.replace('"archived_url":null',`"archived_url":"${archive}"`);
          }).join('\n');
          if(hits!==1) throw new Error(`Expected one target, found ${hits}`);
          fs.writeFileSync('data/evidence.json',text);
          let quality=fs.readFileSync('scripts/check-source-quality-baseline.mjs','utf8');
          if((quality.match(/  risky_host_unarchived: 17,/g)??[]).length!==1) throw new Error('Unexpected risky ceiling boundary');
          quality=quality.replace('  risky_host_unarchived: 17,','  risky_host_unarchived: 16,');
          if(!quality.includes('  terminal_unarchived: 15,')) throw new Error('Terminal ceiling changed');
          fs.writeFileSync('scripts/check-source-quality-baseline.mjs',quality);
          NODE

      - name: Assert metrics and run dependency-free validation
        run: |
          node scripts/validate-data.mjs
          node scripts/check-source-quality-baseline.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('data/evidence.json','utf8'));
          const bridges=JSON.parse(fs.readFileSync('data/bridges.json','utf8'));
          const byBridge=new Map(bridges.map(x=>[x.id,x]));
          const terminal=new Set(['dead','deprecated','migrated']);
          const riskyHosts=['x.com','twitter.com','medium.com','mirror.xyz','substack.com','docs.google.com','notion.site'];
          const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'').toLowerCase();}catch{return'invalid';}};
          const hasArchive=x=>typeof x.archived_url==='string'&&x.archived_url.trim().length>0;
          const isRisky=h=>riskyHosts.some(base=>h===base||h.endsWith(`.${base}`));
          const uniq=rows=>new Set(rows.map(x=>{try{return new URL(x.url).toString();}catch{return x.url;}})).size;
          const t=evidence.filter(x=>terminal.has(byBridge.get(x.bridge_id)?.status)&&!hasArchive(x));
          const r=evidence.filter(x=>isRisky(host(x.url))&&!hasArchive(x));
          const tw=evidence.filter(x=>['x.com','twitter.com'].includes(host(x.url))&&!hasArchive(x));
          const got={archived:evidence.filter(hasArchive).length,terminal_unique:uniq(t),terminal_records:t.length,risky_unique:uniq(r),risky_records:r.length,twitter_records:tw.length};
          const want={archived:127,terminal_unique:15,terminal_records:25,risky_unique:16,risky_records:30,twitter_records:29};
          if(JSON.stringify(got)!==JSON.stringify(want)) throw new Error(`${JSON.stringify(got)} != ${JSON.stringify(want)}`);
          console.log(JSON.stringify(got,null,2));
          NODE

      - name: Write audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.mkdirSync('docs/audits',{recursive:true});
          const lines=[
            '# Phase 3 — Archive Deferred Retry 02 Canonical Application','',
            'Date: 2026-08-09',`Final applicator run: ${process.env.GITHUB_RUN_ID}`,
            'Review PR: #202','Review run: 31267768565',
            'Full-check runs on the identical canonical patch: 31297896393, 31297963725','',
            '## Scope','',
            'Exactly one reproducible archive mapping approved by Deferred Archive Retry 02 is applied. No acceptance boundary is weakened.','',
            '- Evidence: `bir_src_000166`',
            '- Source: `https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`',
            '- Archive: `https://web.archive.org/web/20221227131535/https://quillaudits.medium.com/decoding-rubic-exchange-exploit-quillaudits-44828e71c417`',
            '- Replay: HTTP 200 HTML, 155,612 bytes in both independent review passes','',
            '## Canonical effect','',
            '- evidence with `archived_url`: 126 → 127',
            '- terminal unarchived unique URLs: 15 → 15',
            '- terminal unarchived records: 25 → 25',
            '- risky-host unarchived unique URLs: 17 → 16',
            '- risky-host unarchived records: 31 → 30',
            '- X/Twitter unarchived records: 29 → 29','',
            'The source-quality ceiling is tightened only for `risky_host_unarchived`, from 17 to 16. The terminal ceiling remains 15.','',
            '## Validation','',
            'The identical canonical patch completed the full repository check sequence twice before finalization. This final applicator reasserts the exact metrics, canonical validation, and source-quality gate without generating dependency lockfiles. The canonical PR runs the normal repository checks again.','',
            '## Safety boundary','',
            'The one-shot applicator removes itself before commit. Permanent scope is exactly canonical evidence, the tightened source-quality ceiling, and this audit.',''
          ];
          fs.writeFileSync('docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md',lines.join('\n'));
          NODE

      - name: Remove applicator, assert scope, commit and push
        run: |
          rm .github/workflows/apply-archive-deferred-retry-02-v5.yml
          git fetch origin main
          actual="$({ git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' 'data/evidence.json' 'docs/audits/phase3-archive-deferred-retry-02-canonical-2026-08-09.md' 'scripts/check-source-quality-baseline.mjs' | sort)"
          printf 'Final diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: apply deferred archive retry 02'
          git push origin HEAD:agent/phase3-archive-deferred-retry-02-canonical
