name: Archive Batch 10 Review

on:
  pull_request:
    paths:
      - ".github/workflows/archive-batch10-review.yml"
      - "scripts/review-archive-batch10.mjs"
      - "scripts/review-archive-batch10-fast.mjs"
      - "scripts/review-archive-batch10-parallel.mjs"
  workflow_dispatch:

jobs:
  review-archive-batch10:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/phase3-archive-capture-batch10-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Review archive Batch 10
        run: node scripts/review-archive-batch10-parallel.mjs
