name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Temporary Holograph report target probe
        shell: bash
        run: |
          set -u
          url='https://t.co/uRGZmgX01Z'
          for pass in 1 2; do
            tmpdir="$(mktemp -d)"
            meta="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 --user-agent 'Mozilla/5.0 BIR source verification' --dump-header "$tmpdir/headers" --output "$tmpdir/body" --write-out '%{http_code}|%{url_effective}|%{content_type}' "$url")"
            rc=$?
            bytes="$(wc -c < "$tmpdir/body" 2>/dev/null || echo 0)"
            echo "HOLOGRAPH_REPORT_PASS=$pass RC=$rc META=$meta BYTES=$bytes"
            rm -rf "$tmpdir"
          done

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Audit full canonical corpus
        run: npm run audit:full-corpus

      - name: Audit exact source counts
        run: npm run audit:source-count

      - name: Audit source quality baseline
        run: npm run audit:source-quality

      - name: Test full-corpus audit failures
        run: npm run audit:full-corpus:test

      - name: Test source-count equality failures
        run: npm run audit:source-count:test

      - name: Test source quality regressions
        run: npm run audit:source-quality:test

      - name: Test monitoring foundation
        run: npm run monitoring:test

      - name: Test production content equality
        run: npm run production:content:test

      - name: Test performance budget failures
        run: npm run performance:test

      - name: Build static site
        run: npm run build

      - name: Check accessibility contract
        run: npm run accessibility:check

      - name: Enforce built-output performance budget
        run: npm run performance:check

      - name: Check built output consistency
        run: npm run dist:check

      - name: Test controlled consistency failures
        run: npm run dist:test
