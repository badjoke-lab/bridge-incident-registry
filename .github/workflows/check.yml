name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Temporary Holograph Notion page-data probe
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://www.notion.so/api/v3/loadCachedPageChunk'
          payload='{"page":{"id":"b5f1e14d-a7b2-456a-a3c3-a1bde796daa4"},"chunkNumber":0,"limit":50,"cursor":{"stack":[]},"verticalColumns":false}'
          for pass in 1 2; do
            tmp="$(mktemp)"
            meta="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 --header 'content-type: application/json' --data "$payload" --output "$tmp" --write-out '%{http_code}|%{content_type}' "$endpoint")"
            rc=$?
            bytes="$(wc -c < "$tmp" 2>/dev/null || echo 0)"
            echo "HOLOGRAPH_NOTION_API_PASS=$pass RC=$rc META=$meta BYTES=$bytes"
            http="${meta%%|*}"
            ctype="${meta#*|}"
            test "$rc" -eq 0
            test "$http" = '200'
            [[ "$ctype" == *'application/json'* ]]
            jq -e 'type == "object" and (.recordMap|type == "object")' "$tmp" >/dev/null
            python3 -c 'import html,re,sys; raw=open(sys.argv[1],encoding="utf-8",errors="ignore").read(); text=html.unescape(raw).lower(); groups={"holograph": ["holograph"], "halborn": ["halborn"], "former_contractor": ["former contractor","former-contractor","contractor"], "privileged_access": ["privileged","admin access","administrator","access"], "mint": ["1 billion","one billion","1,000,000,000"], "hlg": ["hlg"]}; result={k:any(v in text for v in vals) for k,vals in groups.items()}; print("MARKERS="+",".join(f"{k}:{int(v)}" for k,v in result.items())); raise SystemExit(0 if all(result.values()) else 2)' "$tmp"
            rm -f "$tmp"
          done

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Audit full canonical corpus
        run: npm run audit:full-corpus

      - name: Audit exact source counts
        run: npm run audit:source-count

      - name: Audit source quality baseline
        run: npm run audit:source-quality

      - name: Test full-corpus audit failures
        run: npm run audit:full-corpus:test

      - name: Test source-count equality failures
        run: npm run audit:source-count:test

      - name: Test source quality regressions
        run: npm run audit:source-quality:test

      - name: Test monitoring foundation
        run: npm run monitoring:test

      - name: Test production content equality
        run: npm run production:content:test

      - name: Test performance budget failures
        run: npm run performance:test

      - name: Build static site
        run: npm run build

      - name: Check accessibility contract
        run: npm run accessibility:check

      - name: Enforce built-output performance budget
        run: npm run performance:check

      - name: Check built output consistency
        run: npm run dist:check

      - name: Test controlled consistency failures
        run: npm run dist:test
