name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Temporary Wormhole first-party source probe
        shell: bash
        run: |
          set -uo pipefail
          candidates=(
            'https://wormhole.com/reports/2022-02-02-exploit-report/'
            'https://wormholecrypto.medium.com/wormhole-incident-report-02-02-22-ad9b8f21eec6'
          )
          for url in "${candidates[@]}"; do
            accepted_passes=0
            echo "=== PROBE $url ==="
            for pass in 1 2; do
              tmpdir="$(mktemp -d)"
              meta="$(curl --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 --user-agent 'Mozilla/5.0 BIR source verification' --dump-header "$tmpdir/headers" --output "$tmpdir/body" --write-out '%{http_code}|%{url_effective}|%{content_type}' "$url")"
              rc=$?
              bytes="$(wc -c < "$tmpdir/body" 2>/dev/null || echo 0)"
              echo "PASS=$pass RC=$rc META=$meta BYTES=$bytes"
              http="${meta%%|*}"
              rest="${meta#*|}"
              effective="${rest%%|*}"
              ctype="${rest#*|}"
              if [[ "$rc" -eq 0 && "$http" == "200" && "$ctype" == *"text/html"* ]]; then
                python3 - "$tmpdir/body" <<'PY'
import html, re, sys
raw = open(sys.argv[1], 'r', encoding='utf-8', errors='ignore').read()
text = html.unescape(re.sub(r'<[^>]+>', ' ', raw))
text = re.sub(r'\s+', ' ', text).lower()
markers = {
    'incident_report': ('wormhole' in text and 'incident report' in text),
    'amount': ('120,000' in text or '120k' in text or '120000' in text),
    'restart': ('13:29' in text or 'back online' in text or 'brought back online' in text),
}
print('MARKERS=' + ','.join(f'{k}:{int(v)}' for k, v in markers.items()))
raise SystemExit(0 if all(markers.values()) else 2)
PY
                marker_rc=$?
                if [[ "$marker_rc" -eq 0 ]]; then
                  accepted_passes=$((accepted_passes + 1))
                  echo "PROBE_ACCEPT pass=$pass effective=$effective bytes=$bytes"
                else
                  echo "PROBE_REJECT pass=$pass reason=missing_claim_markers effective=$effective"
                fi
              else
                echo "PROBE_REJECT pass=$pass reason=transport_or_response_contract"
              fi
              rm -rf "$tmpdir"
            done
            if [[ "$accepted_passes" -eq 2 ]]; then
              echo "REPRODUCIBLY_ACCEPTED_FIRST_PARTY_SOURCE=$url"
              exit 0
            fi
          done
          echo 'No candidate reproduced the required first-party incident + amount + restart claim set.' >&2
          exit 1

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Audit full canonical corpus
        run: npm run audit:full-corpus

      - name: Audit exact source counts
        run: npm run audit:source-count

      - name: Audit source quality baseline
        run: npm run audit:source-quality

      - name: Test full-corpus audit failures
        run: npm run audit:full-corpus:test

      - name: Test source-count equality failures
        run: npm run audit:source-count:test

      - name: Test source quality regressions
        run: npm run audit:source-quality:test

      - name: Test monitoring foundation
        run: npm run monitoring:test

      - name: Test production content equality
        run: npm run production:content:test

      - name: Test performance budget failures
        run: npm run performance:test

      - name: Build static site
        run: npm run build

      - name: Check accessibility contract
        run: npm run accessibility:check

      - name: Enforce built-output performance budget
        run: npm run performance:check

      - name: Check built output consistency
        run: npm run dist:check

      - name: Test controlled consistency failures
        run: npm run dist:test
