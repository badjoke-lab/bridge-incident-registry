name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type and Astro check
        run: |
          set +e
          npm run check > check-output.txt 2>&1
          status=$?
          cat check-output.txt
          exit $status

      - name: Upload Astro check output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: astro-check-output
          path: check-output.txt

      - name: Validate canonical data
        run: npm run validate:data

      - name: Build static site
        run: npm run build
