name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Phase 2 Batch 2 canonical files
        run: GITHUB_HEAD_REF= node scripts/apply-phase2-batch2.mjs

      - name: Upload generated canonical files
        uses: actions/upload-artifact@v4
        with:
          name: phase2-batch2-generated
          path: |
            data/bridges.json
            data/incidents.json
            data/events.json
            data/evidence.json
          retention-days: 1

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Build static site
        run: npm run build
