name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Phase 2 Batch 4 canonical records
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-batch4-records'
        run: |
          set +e
          node scripts/apply-phase2-batch4.mjs > /tmp/batch4-generator.log 2>&1
          status=$?
          cat /tmp/batch4-generator.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/batch4-generator.log docs/batches/phase2-batch-04-generator-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/batches/phase2-batch-04-generator-error.txt
            git commit -m "debug: capture Batch 4 generator failure" || true
            git push origin HEAD:phase2-batch4-records || true
            exit "$status"
          fi

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Build static site
        run: npm run build

      - name: Commit generated Phase 2 Batch 4 data
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-batch4-records'
        run: |
          if git diff --quiet -- data/bridges.json data/incidents.json data/events.json data/evidence.json data/reference/chains.json data/reference/assets.json; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json data/reference/chains.json data/reference/assets.json
          git commit -m "data: add Phase 2 Batch 4 interoperability incidents"
          git push origin HEAD:phase2-batch4-records
