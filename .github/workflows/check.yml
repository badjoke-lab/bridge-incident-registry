name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Batch 5 staged records
        if: github.head_ref == 'phase2-batch5-records'
        run: |
          python scripts/batch5_apply_data.py
          python scripts/batch5_apply_docs.py

      - name: Install dependencies
        run: npm install

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Build static site
        run: npm run build

      - name: Commit Batch 5 records
        if: github.head_ref == 'phase2-batch5-records' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md data docs
          if git diff --cached --quiet; then
            echo "No Batch 5 changes"
            exit 0
          fi
          git commit -m "data: add Phase 2 Batch 5 migration records"
          git push origin HEAD:phase2-batch5-records
