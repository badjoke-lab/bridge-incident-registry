name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Temporary Holograph Notion exact Wayback probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://garnet-tilapia-acb.notion.site/Holograph-Incident-Post-Mortem-b5f1e14da7b2456aa3c3a1bde796daa4'
          published='20240702'
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$url")"
          accepted_ts=''
          accepted_replay=''
          transport_failures=0

          for pass in 1 2; do
            echo "=== NOTION WAYBACK PASS $pass ==="
            cdx="$(mktemp)"
            set +e
            curl --fail-with-body --silent --show-error --location \
              --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
              --output "$cdx" \
              "https://web.archive.org/cdx/search/cdx?url=${encoded}&matchType=exact&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&filter=mimetype:text/html&from=2024&to=2026&collapse=digest&limit=25"
            cdx_rc=$?
            set -e
            if [[ "$cdx_rc" -ne 0 ]] || ! jq -e 'type == "array"' "$cdx" >/dev/null 2>&1; then
              echo "QUERY_FAILURE pass=$pass curl_rc=$cdx_rc"
              transport_failures=$((transport_failures + 1))
              rm -f "$cdx"
              continue
            fi
            rows="$(jq 'if length > 1 then .[1:] else [] end' "$cdx")"
            rm -f "$cdx"
            echo "CDX_ROWS=$(echo "$rows" | jq 'length')"
            pass_ts=''
            pass_replay=''

            while IFS=$'\t' read -r ts original status mime digest archived_length; do
              test -n "${ts:-}" || continue
              if [[ "$original" != "$url" ]]; then
                echo "REJECT timestamp=$ts reason=original_url_mismatch original=$original"
                continue
              fi
              if [[ "${ts:0:8}" < "$published" ]]; then
                echo "REJECT timestamp=$ts reason=predates_publication"
                continue
              fi
              tmpdir="$(mktemp -d)"
              replay="https://web.archive.org/web/${ts}id_/${original}"
              set +e
              http="$(curl --silent --show-error --location \
                --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
                --dump-header "$tmpdir/headers" --output "$tmpdir/body" \
                --write-out '%{http_code}' "$replay")"
              replay_rc=$?
              set -e
              if [[ "$replay_rc" -ne 0 ]]; then
                echo "REPLAY_FAILURE timestamp=$ts pass=$pass curl_rc=$replay_rc replay=$replay"
                transport_failures=$((transport_failures + 1))
                rm -rf "$tmpdir"
                continue
              fi
              bytes="$(wc -c < "$tmpdir/body" 2>/dev/null || echo 0)"
              ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); v=$0} END{sub(/^[^:]+:[[:space:]]*/,"",v); print v}' "$tmpdir/headers" 2>/dev/null || true)"
              if [[ "$http" == '200' && "$ctype" == *'text/html'* && "$bytes" -ge 65536 ]]; then
                echo "ACCEPT pass=$pass timestamp=$ts http=$http content_type=$ctype bytes=$bytes digest=$digest archived_length=$archived_length replay=$replay"
                pass_ts="$ts"
                pass_replay="$replay"
                rm -rf "$tmpdir"
                break
              fi
              echo "REJECT pass=$pass timestamp=$ts http=$http content_type=$ctype bytes=$bytes reason=replay_contract_failed replay=$replay"
              rm -rf "$tmpdir"
            done < <(echo "$rows" | jq -r '.[] | @tsv')

            if [[ -z "$pass_ts" ]]; then
              echo "PASS_ACCEPTED=0 pass=$pass"
              continue
            fi
            echo "PASS_ACCEPTED=1 pass=$pass timestamp=$pass_ts replay=$pass_replay"
            if [[ -z "$accepted_ts" ]]; then
              accepted_ts="$pass_ts"
              accepted_replay="$pass_replay"
            elif [[ "$accepted_ts" != "$pass_ts" || "$accepted_replay" != "$pass_replay" ]]; then
              echo "REPRODUCIBILITY_FAILURE pass=$pass first=$accepted_ts second=$pass_ts" >&2
              exit 1
            fi
          done

          if [[ -z "$accepted_ts" ]]; then
            echo "NO_REPRODUCIBLE_ACCEPTED_CAPTURE transport_failures=$transport_failures" >&2
            exit 1
          fi
          echo "REPRODUCIBLY_ACCEPTED_TIMESTAMP=$accepted_ts"
          echo "REPRODUCIBLY_ACCEPTED_REPLAY=$accepted_replay"
          echo "TRANSPORT_QUERY_FAILURES=$transport_failures"

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Audit full canonical corpus
        run: npm run audit:full-corpus

      - name: Audit exact source counts
        run: npm run audit:source-count

      - name: Audit source quality baseline
        run: npm run audit:source-quality

      - name: Test full-corpus audit failures
        run: npm run audit:full-corpus:test

      - name: Test source-count equality failures
        run: npm run audit:source-count:test

      - name: Test source quality regressions
        run: npm run audit:source-quality:test

      - name: Test monitoring foundation
        run: npm run monitoring:test

      - name: Test production content equality
        run: npm run production:content:test

      - name: Test performance budget failures
        run: npm run performance:test

      - name: Build static site
        run: npm run build

      - name: Check accessibility contract
        run: npm run accessibility:check

      - name: Enforce built-output performance budget
        run: npm run performance:check

      - name: Check built output consistency
        run: npm run dist:check

      - name: Test controlled consistency failures
        run: npm run dist:test
