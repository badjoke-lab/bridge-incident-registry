name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - phase2-batch3-records

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply Batch 3 Synapse metadata correction
        if: github.event_name == 'push' && github.ref_name == 'phase2-batch3-records'
        run: node scripts/fix-phase2-batch3-synapse.mjs

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Build static site
        run: npm run build

      - name: Commit corrected Batch 3 data
        if: github.event_name == 'push' && github.ref_name == 'phase2-batch3-records'
        run: |
          if git diff --quiet -- data/bridges.json data/events.json data/evidence.json; then
            echo "No corrected data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/events.json data/evidence.json
          git commit -m "data: correct Synapse Batch 3 launch metadata"
          git push origin HEAD:phase2-batch3-records
