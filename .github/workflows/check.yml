name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: review/risky-host-headroom-for-afx
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply bounded Holograph postmortem source replacement
        if: github.event_name == 'pull_request' && github.head_ref == 'review/risky-host-headroom-for-afx'
        run: node scripts/apply-holograph-postmortem-source.mjs

      - name: Install dependencies
        run: npm install

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type and Astro check
        run: npm run check

      - name: Validate canonical data
        run: npm run validate:data

      - name: Validate schema enums
        run: npm run validate:enums

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Audit full canonical corpus
        run: npm run audit:full-corpus

      - name: Audit exact source counts
        run: npm run audit:source-count

      - name: Audit source quality baseline
        run: npm run audit:source-quality

      - name: Test full-corpus audit failures
        run: npm run audit:full-corpus:test

      - name: Test source-count equality failures
        run: npm run audit:source-count:test

      - name: Test source quality regressions
        run: npm run audit:source-quality:test

      - name: Test monitoring foundation
        run: npm run monitoring:test

      - name: Test production content equality
        run: npm run production:content:test

      - name: Test performance budget failures
        run: npm run performance:test

      - name: Build static site
        run: npm run build

      - name: Check accessibility contract
        run: npm run accessibility:check

      - name: Enforce built-output performance budget
        run: npm run performance:check

      - name: Check built output consistency
        run: npm run dist:check

      - name: Test controlled consistency failures
        run: npm run dist:test

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated Holograph source replacement
        if: github.event_name == 'pull_request' && github.head_ref == 'review/risky-host-headroom-for-afx'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show origin/main:.github/workflows/check.yml > .github/workflows/check.yml
          git rm scripts/apply-holograph-postmortem-source.mjs
          git rm .github/workflows/risky-host-headroom-review.yml
          git rm .github/workflows/wormhole-source-consolidation-review.yml
          git restore package.json 2>/dev/null || true
          git restore package-lock.json 2>/dev/null || true
          git add -- .github/workflows/check.yml data/evidence.json docs/audits/holograph-postmortem-source-consolidation-2026-08-21.md
          git status --short
          git commit -m "Replace Holograph risky-host source with postmortem"
          git push origin HEAD:review/risky-host-headroom-for-afx
