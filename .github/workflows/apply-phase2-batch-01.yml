name: Generate Phase 2 Batch 1

on:
  pull_request:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate canonical records
        run: node scripts/apply-phase2-batch-01.mjs

      - name: Install dependencies
        run: npm install

      - name: Validate generated data
        run: npm run validate:data

      - name: Type and Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Upload validated generated data
        uses: actions/upload-artifact@v4
        with:
          name: phase2-batch-01-generated-data
          path: |
            data/bridges.json
            data/incidents.json
            data/events.json
            data/evidence.json
          if-no-files-found: error
          retention-days: 3
