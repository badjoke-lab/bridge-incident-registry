name: Apply Phase 2 Batch 1

on:
  push:
    branches:
      - phase2-meter-allbridge-lifi

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'data: apply phase 2 batch 1 records'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase2-meter-allbridge-lifi
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate canonical records
        run: node scripts/apply-phase2-batch-01.mjs

      - name: Validate generated data
        run: npm install && npm run validate:data && npm run check && npm run build

      - name: Commit generated records
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: data: apply phase 2 batch 1 records
          file_pattern: data/*.json
