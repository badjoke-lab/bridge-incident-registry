name: TEMP Batch 15 Optimism Applicator
on:
  push:
    branches:
      - canonical/growth-batch-15-optimism-standard-bridge
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply guarded canonical addition
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bridges = JSON.parse(fs.readFileSync('data/bridges.json','utf8'));
          const incidents = JSON.parse(fs.readFileSync('data/incidents.json','utf8'));
          const events = JSON.parse(fs.readFileSync('data/events.json','utf8'));
          const evidence = JSON.parse(fs.readFileSync('data/evidence.json','utf8'));
          const maxNum=(arr,prefix)=>Math.max(...arr.map(x=>Number(String(x.id).replace(prefix,''))).filter(Number.isFinite));
          const baseline=[bridges.length,incidents.length,events.length,evidence.length];
          if (baseline.join('/') !== '67/51/241/395') throw new Error('baseline mismatch '+baseline.join('/'));
          if (maxNum(bridges,'bir_bridge_') !== 67) throw new Error('bridge max mismatch');
          if (maxNum(events,'bir_ev_') !== 241) throw new Error('event max mismatch');
          if (maxNum(evidence,'bir_src_') !== 396) throw new Error('evidence max mismatch');
          const needles=['optimism standard bridge','optimism bridge','optimism gateway','op mainnet standard bridge','optimism-standard-bridge'];
          for (const b of bridges) {
            const hay=[b.canonical_name,b.slug,...(b.aliases||[]),...(b.previous_slugs||[]),...(b.redirect_from||[])].filter(Boolean).map(x=>String(x).toLowerCase());
            if (needles.some(n=>hay.includes(n))) throw new Error('duplicate guard hit '+b.id);
          }
          const templateBridge=bridges.find(x=>x.id==='bir_bridge_000067');
          const templateEvent=events.find(x=>x.id==='bir_ev_000241');
          const evTemplates=evidence.filter(x=>x.bridge_id==='bir_bridge_000067').slice(-2);
          if (!templateBridge || !templateEvent || evTemplates.length<2) throw new Error('template missing');
          const bridge={...templateBridge,
            id:'bir_bridge_000068',slug:'optimism-standard-bridge',previous_slugs:[],redirect_from:[],canonical_name:'Optimism Standard Bridge',type:'canonical_bridge',status:'active',
            summary:'Optimism Standard Bridge is the native token bridge system between Ethereum and OP Mainnet. Public Optimistic Ethereum access on July 13, 2021 included a redesigned token bridge, while current Optimism documentation identifies the Standard Bridge as the native ETH/ERC-20 bridging system for OP Mainnet.',
            confidence:'high',record_maturity:'reviewed',update_status:'current',last_reviewed_at:'2026-08-30',last_verified_at:'2026-08-30',
            aliases:['Optimism Bridge','Optimism Gateway','OP Mainnet Standard Bridge'],launch_date:'2021-07-13',launch_date_precision:'day',end_date:null,end_date_precision:'unknown',terminal_reason:null,
            official_url:'https://docs.optimism.io/app-developers/guides/bridging/standard-bridge',official_domain:'docs.optimism.io',official_url_status:'live',archived_url:null,
            primary_chains:['ethereum','optimism'],primary_assets:['eth','unknown'],operator_name:'Optimism',operator_type:'protocol ecosystem',ecosystem_name:'Optimism',related_protocols:['OP Mainnet'],
            brand_history_notes:'Later Optimism Gateway/front-end changes and Bedrock-era bridge contract upgrades are treated as evolution within the same native Standard Bridge lineage unless future first-party evidence establishes a distinct bridge product.',
            major_incident_count:0,has_unresolved_incident:false,has_reimbursement_history:false,successor_id:null,predecessor_id:null,replacement_bridge_id:null,duplicate_of:null,merged_into:null,
            notes:'Public availability is bounded to July 13, 2021 from contemporaneous launch evidence. No incident is inferred.'
          };
          const event={...templateEvent,
            id:'bir_ev_000242',bridge_id:'bir_bridge_000068',incident_id:null,event_type:'bridge_launched',event_date:'2021-07-13',event_date_precision:'day',
            title:'Optimism Standard Bridge available with public Optimistic Ethereum access',
            description:'Public Optimistic Ethereum access on July 13, 2021 included a redesigned token bridge for deposits from Ethereum; current Optimism documentation identifies the native bridge lineage as the Standard Bridge.',
            confidence:'high',record_maturity:'reviewed',update_status:'current',impact_level:'context',status_effect:'active',source_count:2,sort_order:10,amount_text:null,recovered_amount_text:null,reimbursement_status:'not_applicable',restart_status:'not_applicable',affected_chains:['ethereum','optimism'],affected_assets:['eth','unknown'],notes:'Launch boundary uses contemporaneous public-access evidence and protocol audit context; risky-host Optimism Medium material is review-only.',duplicate_of:null,merged_into:null
          };
          const baseEv=(id)=>({...evTemplates[0],id,bridge_id:'bir_bridge_000068',incident_id:null,event_id:'bir_ev_000242',reliability:'high',source_tier:'tier_1',url_status:'live',accessed_at:'2026-08-30',claim_scope:'launch',language:'en',author:null,quote_excerpt:null,is_paywalled:false,supports_amount:false,supports_recovery:false,supports_reimbursement:false,supports_reopen:false,supports_shutdown:false,supports_migration:false,archived_url:null});
          const src397={...baseEv('bir_src_000397'),source_type:'official_announcement',title:'Uniswap v3 on Optimism Alpha',url:'https://blog.uniswap.org/uniswap-optimism-alpha',publisher:'Uniswap Labs',published_at:'2021-07-13',published_at_precision:'day',is_primary:false,is_official_domain:true,notes:'Contemporaneous first-party integration announcement states users could migrate assets through the Optimism Gateway on July 13, 2021, corroborating public bridge availability.'};
          const src398={...baseEv('bir_src_000398'),source_type:'audit_report',title:'Optimism OVM and Rollup Audit',url:'https://docs.optimism.io/audit-reports/2021_03-OVM_and_Rollup-OpenZeppelin.pdf',publisher:'OpenZeppelin / Optimism',published_at:'2021-03',published_at_precision:'month',is_primary:true,is_official_domain:true,notes:'Optimism-hosted OpenZeppelin audit documents the L1/L2 token bridge and gateway contract architecture preceding public launch, supporting the native bridge lineage.'};
          bridges.push(bridge); events.push(event); evidence.push(src397,src398);
          fs.writeFileSync('data/bridges.json',JSON.stringify(bridges,null,2)+'\n');
          fs.writeFileSync('data/events.json',JSON.stringify(events,null,2)+'\n');
          fs.writeFileSync('data/evidence.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Remove temporary applicator
        run: rm -f .github/workflows/temp-batch15-optimism-applicator.yml
      - name: Commit canonical data and self-delete helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bridges.json data/events.json data/evidence.json .github/workflows/temp-batch15-optimism-applicator.yml
          git commit -m 'data: add Optimism Standard Bridge'
          git push
