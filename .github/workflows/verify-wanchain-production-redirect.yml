name: Verify Wanchain Production Redirect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-wanchain-production-redirect.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify both legacy URL forms with bounded publication retries
        shell: bash
        run: |
          set +e
          success=false
          last_attempt=0
          for attempt in $(seq 1 30); do
            last_attempt="$attempt"
            ATTEMPT="$attempt" node <<'NODE' | tee /tmp/wanchain-redirect-result.json
          const origin = 'https://bir.badjoke-lab.com';
          const target = '/bridge/wanbridge/';
          const paths = ['/bridge/wanchain-bridge', '/bridge/wanchain-bridge/'];
          const observations = [];
          let ok = true;
          for (const path of paths) {
            try {
              const response = await fetch(`${origin}${path}`, { redirect: 'manual' });
              const location = response.headers.get('location');
              const normalized = location ? new URL(location, origin).pathname : null;
              observations.push({ path, status: response.status, location, normalized });
              if (response.status !== 301 || normalized !== target) ok = false;
            } catch (error) {
              observations.push({ path, error: String(error) });
              ok = false;
            }
          }
          console.log(JSON.stringify({ attempt: Number(process.env.ATTEMPT), ok, target, observations }, null, 2));
          process.exit(ok ? 0 : 1);
          NODE
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              success=true
              break
            fi
            sleep 5
          done
          set -e
          echo "Final result after ${last_attempt} attempt(s):"
          cat /tmp/wanchain-redirect-result.json
          [ "$success" = true ]
