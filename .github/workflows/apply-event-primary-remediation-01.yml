name: Apply Event Primary Remediation 01

on:
  push:
    branches:
      - agent/phase3-event-primary-remediation-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact canonical patch
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const evidencePath='data/evidence.json';
          let text=fs.readFileSync(evidencePath,'utf8');
          let seen003=0;
          let seen014=0;
          text=text.split('\n').map((line)=>{
            if(line.includes('"id":"bir_src_000003"')){
              seen003++;
              const required=[
                '"url":"https://home.treasury.gov/news/press-releases/jy0716"',
                '"title":"Treasury sanctions Lazarus-linked crypto activity context"',
                '"publisher":"U.S. Department of the Treasury"',
                '"is_primary":false',
                '"notes":"Government source for DPRK/Lazarus attribution context."'
              ];
              for(const needle of required){if(!line.includes(needle)) throw new Error(`bir_src_000003 missing expected boundary: ${needle}`);}
              line=line
                .replace('"url":"https://home.treasury.gov/news/press-releases/jy0716"','"url":"https://ofac.treasury.gov/recent-actions/20220414"')
                .replace('"title":"Treasury sanctions Lazarus-linked crypto activity context"','"title":"North Korea Designation Update"')
                .replace('"publisher":"U.S. Department of the Treasury"','"publisher":"Office of Foreign Assets Control"')
                .replace('"is_primary":false','"is_primary":true')
                .replace('"notes":"Government source for DPRK/Lazarus attribution context."','"notes":"OFAC April 14, 2022 designation update adding the Ronin getaway Ethereum address to the Lazarus Group SDN entry; authoritative government attribution boundary for the Ronin incident."');
            }
            if(line.includes('"id":"bir_src_000014"')){
              seen014++;
              if(!line.includes('"is_primary":false')) throw new Error('bir_src_000014 primary boundary moved');
              line=line.replace('"is_primary":false','"is_primary":true');
            }
            return line;
          }).join('\n');
          if(seen003!==1||seen014!==1) throw new Error(`target count mismatch: 003=${seen003}, 014=${seen014}`);
          fs.writeFileSync(evidencePath,text);

          const qualityPath='scripts/check-source-quality-baseline.mjs';
          let quality=fs.readFileSync(qualityPath,'utf8');
          const old='  events_without_primary: 16,';
          if((quality.match(/  events_without_primary: 16,/g)??[]).length!==1) throw new Error('Unexpected events_without_primary ceiling boundary');
          quality=quality.replace(old,'  events_without_primary: 14,');
          fs.writeFileSync(qualityPath,quality);
          NODE

      - name: Assert exact canonical state
        run: |
          node scripts/validate-data.mjs
          node scripts/check-source-quality-baseline.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('data/evidence.json','utf8'));
          const events=JSON.parse(fs.readFileSync('data/events.json','utf8'));
          const byEvent=new Map(events.map(x=>[x.id,[]]));
          for(const s of evidence){if(s.event_id) byEvent.get(s.event_id)?.push(s);}
          const missing=events.filter(e=>!(byEvent.get(e.id)??[]).some(s=>s.is_primary===true));
          if(missing.length!==14) throw new Error(`Expected 14 events without primary, observed ${missing.length}`);
          const s003=evidence.find(x=>x.id==='bir_src_000003');
          const s014=evidence.find(x=>x.id==='bir_src_000014');
          if(!s003||s003.url!=='https://ofac.treasury.gov/recent-actions/20220414'||s003.title!=='North Korea Designation Update'||s003.publisher!=='Office of Foreign Assets Control'||s003.is_primary!==true) throw new Error('bir_src_000003 mismatch');
          if(!s014||s014.is_primary!==true) throw new Error('bir_src_000014 mismatch');
          if(evidence.length!==284) throw new Error(`Evidence count changed: ${evidence.length}`);
          console.log(JSON.stringify({evidence:evidence.length,events_without_primary:missing.length,primary_evidence:evidence.filter(x=>x.is_primary===true).length,tier1_evidence:evidence.filter(x=>x.source_tier==='tier_1').length},null,2));
          NODE

      - name: Write permanent audit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.mkdirSync('docs/audits',{recursive:true});
          const lines=[
            '# Phase 3 Event Primary Remediation 01 — Canonical Application','',
            'Date: 2026-08-09',`Applicator run: ${process.env.GITHUB_RUN_ID}`,
            'Review PR: #207','Review audit: `docs/audits/phase3-event-primary-review-01-2026-08-09.md`','',
            '## Canonical changes','',
            '- corrected `bir_src_000003` from the unrelated Treasury `jy0716` URL to the April 14, 2022 OFAC North Korea Designation Update;',
            '- synchronized `bir_src_000003` title and publisher to the corrected OFAC source;',
            '- reclassified `bir_src_000003` as claim-relative primary evidence for `bir_ev_000002`;',
            '- reclassified `bir_src_000014` as claim-relative primary evidence for `bir_ev_000011`;',
            '- tightened `events_without_primary` from 16 to 14.','',
            'No event wording, dates, amounts, statuses, source counts, evidence count, Tier 1 classification, or intentional secondary boundaries changed.','',
            '## Expected state','',
            '```text','Evidence records                   284','Events without primary evidence     14','Events without Tier 1 evidence       6','```','',
            '## Safety boundary','',
            'The one-shot applicator removes itself before commit. Permanent scope is exactly canonical evidence, the tightened source-quality ceiling, and this audit.',''
          ];
          fs.writeFileSync('docs/audits/phase3-event-primary-remediation-01-canonical-2026-08-09.md',lines.join('\n'));
          NODE

      - name: Remove applicator, assert scope, commit and push
        run: |
          rm .github/workflows/apply-event-primary-remediation-01.yml
          git fetch origin main
          actual="$({ git diff --name-only origin/main -- .; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' 'data/evidence.json' 'docs/audits/phase3-event-primary-remediation-01-canonical-2026-08-09.md' 'scripts/check-source-quality-baseline.mjs' | sort)"
          printf 'Final diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'data: remediate event primary evidence 01'
          git push origin HEAD:agent/phase3-event-primary-remediation-01
