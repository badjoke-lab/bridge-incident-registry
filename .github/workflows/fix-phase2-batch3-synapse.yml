name: Fix Phase 2 Batch 3 Synapse metadata

on:
  push:
    branches:
      - phase2-batch3-records

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase2-batch3-records
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply Synapse metadata correction
        run: node scripts/fix-phase2-batch3-synapse.mjs

      - name: Validate canonical data
        run: npm run validate:data

      - name: Audit first ten seeds
        run: npm run audit:first-ten

      - name: Type and Astro check
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Commit corrected canonical files
        run: |
          if git diff --quiet -- data/bridges.json data/events.json data/evidence.json; then
            echo "No corrected changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bridges.json data/events.json data/evidence.json
          git commit -m "data: correct Synapse Batch 3 launch metadata"
          git push origin HEAD:phase2-batch3-records
