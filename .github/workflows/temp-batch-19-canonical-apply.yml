name: TEMP Batch 19 canonical apply

on:
  push:
    branches:
      - canonical/growth-batch-19-ad-astra-bridge

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Apply guarded canonical delta
        run: |
          node <<'NODE'
          const fs = require('fs');
          const paths = {
            bridges: 'data/bridges.json', incidents: 'data/incidents.json', events: 'data/events.json', evidence: 'data/evidence.json'
          };
          const data = Object.fromEntries(Object.entries(paths).map(([k,p]) => [k, JSON.parse(fs.readFileSync(p,'utf8'))]));
          const expected = {bridges:71, incidents:51, events:245, evidence:400};
          for (const [k,n] of Object.entries(expected)) if (data[k].length !== n) throw new Error(`baseline ${k}: expected ${n}, got ${data[k].length}`);
          const maxNum = (arr,prefix) => Math.max(...arr.map(x => Number(x.id.replace(prefix,''))));
          if (maxNum(data.bridges,'bir_bridge_') !== 71) throw new Error('bridge max id drift');
          if (maxNum(data.events,'bir_ev_') !== 245) throw new Error('event max id drift');
          if (maxNum(data.evidence,'bir_src_') !== 401) throw new Error('evidence max id drift');
          const dup = data.bridges.some(b => [b.slug,b.canonical_name,...(b.aliases||[])].map(String).map(s=>s.toLowerCase()).some(s => ['ad-astra-bridge','ad-astra bridge','ad astra portal','elrond ad astra portal','multiversx bridge'].includes(s)));
          if (dup) throw new Error('duplicate Ad-Astra identity detected');
          data.bridges.push({
            id:'bir_bridge_000072', slug:'ad-astra-bridge', previous_slugs:[], redirect_from:[], canonical_name:'Ad-Astra Bridge', type:'canonical_bridge', status:'active',
            summary:'Ad-Astra Bridge is MultiversX’s first-party cross-chain bridge lineage, launched as the Elrond Ad Astra Portal for Ethereum and later expanded under the MultiversX Bridge interface.',
            confidence:'high', record_maturity:'reviewed', update_status:'current', last_reviewed_at:'2026-08-31', last_verified_at:'2026-08-31',
            end_date:null, end_date_precision:'unknown', terminal_reason:null, archived_url:null, major_incident_count:0, has_unresolved_incident:false, has_reimbursement_history:false,
            successor_id:null, predecessor_id:null, replacement_bridge_id:null, duplicate_of:null, merged_into:null,
            aliases:['Ad Astra Portal','Elrond Ad Astra Portal','MultiversX Bridge'], launch_date:'2022-05-24', launch_date_precision:'day',
            official_url:'https://bridge.multiversx.com/', official_domain:'bridge.multiversx.com', official_url_status:'live_verified', primary_chains:['ethereum','unknown'], primary_assets:['unknown'],
            operator_name:'MultiversX', operator_type:'foundation', ecosystem_name:'MultiversX', related_protocols:[],
            brand_history_notes:'The 2023 MultiversX Bridge interface and BSC expansion are treated as lifecycle evolution of the Ad-Astra bridge lineage unless future first-party evidence establishes a distinct successor.',
            notes:'The launch boundary is the May 24, 2022 first-party Ad Astra Portal go-live announcement. MultiversX does not yet have a dedicated BIR chain-reference key, so that side is conservatively represented as unknown. No incident is inferred.'
          });
          data.events.push({
            id:'bir_ev_000246', bridge_id:'bir_bridge_000072', incident_id:null, confidence:'high', record_maturity:'reviewed', update_status:'current', impact_level:'context', status_effect:'active', sort_order:10,
            amount_text:null, recovered_amount_text:null, reimbursement_status:'not_applicable', restart_status:'not_applicable', affected_assets:['unknown'],
            notes:'Launch boundary is taken directly from MultiversX/Elrond first-party material announcing the Ad Astra Portal go-live on May 24, 2022.', duplicate_of:null, merged_into:null,
            event_type:'bridge_launched', event_date:'2022-05-24', event_date_precision:'day', title:'Ad Astra Portal goes live between Elrond and Ethereum',
            description:'MultiversX/Elrond announced the go-live of the Ad Astra Portal as a token bridge connecting Elrond and Ethereum.', source_count:1, affected_chains:['ethereum','unknown']
          });
          data.evidence.push({
            id:'bir_src_000402', bridge_id:'bir_bridge_000072', event_id:'bir_ev_000246', incident_id:null, reliability:'high', source_tier:'tier_1', url_status:'live', accessed_at:'2026-08-31', claim_scope:'launch', language:'en', author:null, quote_excerpt:null,
            is_primary:true, is_paywalled:false, is_official_domain:true, supports_amount:false, supports_recovery:false, supports_reimbursement:false, supports_reopen:false, supports_shutdown:false, supports_migration:false,
            source_type:'official_announcement', title:'Ad Astra Portal: Elrond Ethereum Bridge Goes Live', url:'https://multiversx.com/blog/ad-astra-portal-elrond-ethereum-bridge-goes-live', publisher:'MultiversX / Elrond',
            published_at:'2022-05-24', published_at_precision:'day', archived_url:null,
            notes:'First-party launch announcement explicitly states the go-live of the Elrond Ad Astra Portal and describes it as a newly launched token bridge between Elrond and Ethereum.'
          });
          for (const [k,p] of Object.entries(paths)) fs.writeFileSync(p, JSON.stringify(data[k], null, 2)+'\n');
          NODE
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - run: npm run check
      - run: npm run build
      - run: npm run accessibility:check
      - run: npm run performance:check
      - run: npm run dist:check
      - name: Commit canonical data and remove helper
        run: |
          rm .github/workflows/temp-batch-19-canonical-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bridges.json data/events.json data/evidence.json .github/workflows/temp-batch-19-canonical-apply.yml
          git commit -m 'data: add Ad-Astra Bridge canonical record'
          git push
