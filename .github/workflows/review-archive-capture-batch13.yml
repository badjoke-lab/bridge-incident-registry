name: Review Archive Capture Batch 13

on:
  push:
    branches:
      - agent/phase3-archive-capture-batch13-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run bounded archive review
        run: node scripts/review-archive-capture-batch13.mjs

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-capture-batch13-review
          path: artifacts/archive-capture-batch13-review.*
          if-no-files-found: error
