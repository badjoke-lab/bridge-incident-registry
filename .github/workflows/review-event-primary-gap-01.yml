name: Review Event Primary Gap 01

on:
  push:
    branches:
      - agent/phase3-event-primary-review-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract bounded review packet
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ids=['bir_ev_000002','bir_ev_000011','bir_ev_000013','bir_ev_000014','bir_ev_000124','bir_ev_000125','bir_ev_000143','bir_ev_000144','bir_ev_000148'];
          const bridges=JSON.parse(fs.readFileSync('data/bridges.json','utf8'));
          const incidents=JSON.parse(fs.readFileSync('data/incidents.json','utf8'));
          const events=JSON.parse(fs.readFileSync('data/events.json','utf8'));
          const evidence=JSON.parse(fs.readFileSync('data/evidence.json','utf8'));
          const bridgeById=new Map(bridges.map(x=>[x.id,x]));
          const incidentById=new Map(incidents.map(x=>[x.id,x]));
          const eventById=new Map(events.map(x=>[x.id,x]));
          const packet=[];
          for(const id of ids){
            const event=eventById.get(id);
            if(!event) throw new Error(`missing ${id}`);
            const current=evidence.filter(s=>s.event_id===id);
            const related=evidence.filter(s=>s.is_primary===true&&(s.bridge_id===event.bridge_id||s.incident_id===event.incident_id));
            packet.push({event,bridge:bridgeById.get(event.bridge_id)??null,incident:event.incident_id?incidentById.get(event.incident_id)??null:null,current_evidence:current,related_primary_evidence:related});
          }
          const result={generated_at:new Date().toISOString(),review_event_ids:ids,packet};
          fs.writeFileSync('artifacts/event-primary-review-01.json',JSON.stringify(result,null,2)+'\n');
          console.log('EVENT_PRIMARY_REVIEW_01_START');
          console.log(JSON.stringify(result,null,2));
          console.log('EVENT_PRIMARY_REVIEW_01_END');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: event-primary-review-01
          path: artifacts/event-primary-review-01.json
          if-no-files-found: error
