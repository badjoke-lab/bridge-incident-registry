name: Stage ChainConnect Performance Fix

on:
  push:
    branches:
      - chainconnect-2026-application
    paths:
      - .github/workflows/chainconnect-perf-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chainconnect-2026-application
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compress list-visible incident text without changing evidence semantics
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'data/incidents.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const record = data.find((item) => item.id === 'bir_inc_000040');
          if (!record) throw new Error('bir_inc_000040 not found');
          record.summary = 'On July 26, 2026, missing sender verification in a ChainConnect Alien Proxy callback enabled unbacked Alien TIP-3 minting and bridging to Ethereum. ChainConnect paused and patched affected deployments. Venom later reported 82.9% (~USD 615,000) returned and 17.1% retained as a whitehat bounty; post-incident reopening remains unverified.';
          record.reported_loss_text = 'SlowMist reports an approximately USD 650,000 incident estimate. Venom separately reports ~USD 615,000 as the returned 82.9%; BIR does not treat either as an exact canonical gross loss because claim scope and valuation timing differ.';
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate and enforce unchanged performance ceiling
        run: |
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
          npm run build
          npm run performance:check
          git diff --check
      - name: Commit validated fix to branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git commit -m "data: compress ChainConnect list-visible incident text"
          git push origin HEAD:chainconnect-2026-application
