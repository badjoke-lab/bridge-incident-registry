name: Batch 21 HECO doc count sync v2

on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-03-heco
    paths:
      - .github/workflows/batch21-heco-sync-doc-counts-v2.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-21-tranche-03-heco
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/batch21-heco-sync-doc-counts.mjs
      - run: npm install
      - run: npm run build
      - run: npm run dist:check
      - name: Commit synchronized counts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git diff --cached --quiet && exit 0
          git commit -m "Sync HECO tranche canonical document counts"
          git push origin HEAD:canonical/growth-batch-21-tranche-03-heco
