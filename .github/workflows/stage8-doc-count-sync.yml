name: BIR Stage 8 document count sync

on:
  push:
    branches:
      - agent/stage8-bounded-canonical
    paths:
      - .github/workflows/stage8-doc-count-sync.yml
      - scripts/sync-stage8-document-counts.mjs

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/stage8-bounded-canonical
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sync canonical count references
        run: node scripts/sync-stage8-document-counts.mjs
      - name: Commit document count synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git diff --cached --exit-code && { echo "Expected document count delta was not produced"; exit 1; }
          git commit -m "Sync BIR Stage 8 canonical counts"
          git push origin HEAD:agent/stage8-bounded-canonical
