name: Batch 20 audit fix

on:
  push:
    branches:
      - canonical/growth-batch-20-incident-heavy
    paths:
      - scripts/batch20-fix.mjs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-20-incident-heavy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/batch20-fix.mjs
      - run: |
          node -e "for (const f of ['data/incidents.json','data/events.json','data/evidence.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          npm install
          npm run audit:full-corpus
          npm run audit:source-count
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/incidents.json data/events.json data/evidence.json
          git commit -m 'Fix Batch 20 event evidence boundaries'
          git push origin HEAD:canonical/growth-batch-20-incident-heavy
