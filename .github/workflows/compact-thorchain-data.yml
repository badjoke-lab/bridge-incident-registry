name: Compact THORChain data

on:
  push:
    branches:
      - seed-thorchain
    paths:
      - scripts/compact-thorchain-data.mjs
      - .github/workflows/compact-thorchain-data.yml

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seed-thorchain
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/compact-thorchain-data.mjs
      - run: rm scripts/compact-thorchain-data.mjs .github/workflows/compact-thorchain-data.yml
      - name: Commit compact canonical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/evidence.json scripts .github/workflows
          git commit -m "chore: compact canonical data formatting"
          git push origin HEAD:seed-thorchain
