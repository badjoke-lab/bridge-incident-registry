name: TEMP Batch 08 Three Bridge Applicator
on:
  push:
    branches:
      - canonical/growth-batch-08-three-bridges
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'TEMP Batch 08')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/growth-batch-08-three-bridges
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-batch-08-three-bridges.mjs
