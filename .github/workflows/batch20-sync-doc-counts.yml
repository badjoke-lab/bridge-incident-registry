name: Batch 20 sync doc counts

on:
  push:
    branches:
      - canonical/growth-batch-20-incident-heavy

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-20-incident-heavy
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/batch20-sync-doc-counts.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build && npm run dist:check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/runbooks/current-status.md docs/runbooks/recovery-checkpoint.md docs/runbooks/development-roadmap.md docs/runbooks/public-consistency-remediation.md
          git commit -m 'Sync Batch 20 canonical counts in docs'
          git push origin HEAD:canonical/growth-batch-20-incident-heavy
