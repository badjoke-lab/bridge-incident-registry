name: Batch 20 source quality fix

on:
  push:
    branches:
      - canonical/growth-batch-20-incident-heavy
    paths:
      - scripts/batch20-source-quality-fix.mjs

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-20-incident-heavy
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/batch20-source-quality-fix.mjs
      - run: |
          npm install
          npm run validate:data
          npm run validate:enums
          npm run audit:full-corpus
          npm run audit:source-count
          npm run audit:source-quality
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m 'Tighten Batch 20 to primary-evidence incidents'
          git push origin HEAD:canonical/growth-batch-20-incident-heavy
