name: Apply SKALE tranche 08
on:
  push:
    branches:
      - canonical/growth-batch-21-tranche-08-skale-2026
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: canonical/growth-batch-21-tranche-08-skale-2026
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/apply-skale-tranche-08.mjs
      - run: npm run validate:data
      - run: npm run validate:enums
      - run: npm run audit:full-corpus
      - run: npm run audit:source-count
      - run: npm run audit:source-quality
      - name: Commit canonical data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/bridges.json data/incidents.json data/events.json data/evidence.json
          git commit -m "Add SKALE IMA Bridge 2026 canonical incident records"
          git push origin HEAD:canonical/growth-batch-21-tranche-08-skale-2026
