name: Phase 3 Aftermath Source Inventory

on:
  push:
    branches:
      - agent/phase3-aftermath-source-review

permissions:
  contents: write

jobs:
  inventory:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-aftermath-source-review
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate source inventory
        run: node scripts/report-phase3-aftermath-gaps.mjs

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/.phase3-aftermath-source-inventory.md
          if git diff --cached --quiet; then
            echo "No inventory changes."
            exit 0
          fi
          git commit -m "docs: capture Phase 3 aftermath source inventory [inventory]"
          git push origin HEAD:agent/phase3-aftermath-source-review
